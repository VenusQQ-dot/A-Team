<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Claude Cowork 基礎入門班</title>
<style>
:root{color-scheme:light;--card:#fff;--soft:#F7F3EA;--soft2:#E8E0D0;--bubble:#F0E8D8;--mmbg:#F5F2EA;--dot:#d8cfbd;--inv:#2B2A27;--inv-fg:#fff;--bw:1px;--font-head:var(--serif);--bg:#F1ECE2;--paper:#FBF8F2;--ink:#2B2A27;--muted:#6F6A5F;--line:#E1D8C8;--accent:#C96442;--accent-d:#A94E31;--accent-soft:#F6E1D6;--green:#3E7C59;--green-soft:#DDEBDF;--blue:#3B6EA5;--blue-soft:#DCE8F4;--warn:#B4382B;--warn-soft:#F8DDD8;--amber:#B7791F;--amber-soft:#F8EBC8;--r:12px;--serif:"Noto Serif TC","Source Han Serif TC","Songti TC","PMingLiU",Georgia,serif;--sans:system-ui,-apple-system,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
h1,h2,h3,h4,p{margin:0}
svg{flex:none}
#app{height:100%;display:flex;flex-direction:column}

/* ===== top bar ===== */
.topbar{height:56px;flex:none;display:flex;align-items:center;gap:16px;padding:0 20px;border-bottom:1px solid var(--line);background:var(--paper)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:32px;height:32px;border-radius:9px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:19px}
.brand b{font-family:var(--serif);font-size:17px;white-space:nowrap}
.brand small{display:block;color:var(--muted);font-size:12px;line-height:1.2}
.pbar{flex:1;max-width:320px;height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.pbar i{display:block;height:100%;width:0;background:var(--accent);transition:width .5s}
.score{font-size:13px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.score b{color:var(--ink);font-size:17px}
.tspacer{flex:1}
.tbtn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:5px 11px;font-size:13px;white-space:nowrap}
.tbtn:hover{border-color:var(--accent)}
.tbtn.on{background:var(--inv);color:var(--inv-fg);border-color:var(--ink)}
.panes{display:none}

/* ===== layout ===== */
.layout{flex:1;min-height:0;display:grid;grid-template-columns:minmax(390px,37%) 1fr}
.coach{overflow:auto;padding:14px 20px 70px;border-right:1px solid var(--line);scroll-behavior:smooth}
.stage{padding:16px;min-width:0;min-height:0;display:flex;background:radial-gradient(circle at 1px 1px,var(--dot) 1px,transparent 0) 0 0/18px 18px}

/* ===== coach panel ===== */
.units{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;margin:0 -4px 6px;scrollbar-width:thin}
.upill{flex:none;display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:4px 12px 4px 5px;font-size:13px;white-space:nowrap}
.upill .n{width:22px;height:22px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-size:12px;font-weight:700}
.upill.on{border-color:var(--accent);background:var(--accent-soft)}
.upill.on .n{background:var(--accent);color:#fff}
.upill.done .n{background:var(--green);color:#fff}
.upill.lock{opacity:.5}
.kick{color:var(--accent-d);font-size:13px;font-weight:700;letter-spacing:.06em}
.unit h2{font-family:var(--serif);font-size:26px;line-height:1.3;margin:2px 0 4px}
.goal{color:var(--muted);margin-bottom:12px}
.unit h3{font-size:15px;margin:22px 0 8px;display:flex;align-items:center;gap:8px}
.unit h3 em{font-style:normal;font-size:12px;font-weight:600;color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:99px;padding:0 8px}

.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kcard{perspective:700px;height:132px}
.kcard>div{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.kcard.flip>div{transform:rotateY(180deg)}
.kcard span{position:absolute;inset:0;backface-visibility:hidden;border-radius:var(--r);padding:10px 11px;display:flex;flex-direction:column;justify-content:center;border:1px solid var(--line);background:var(--card)}
.kcard .f b{font-family:var(--serif);font-size:18px;line-height:1.3}
.kcard .f small{color:var(--muted);margin-top:4px}
.kcard .b{transform:rotateY(180deg);background:var(--accent-soft);border-color:#EBC3AF;font-size:13px;line-height:1.5}

.steps{list-style:none;margin:0;padding:0;display:grid;gap:7px}
.step{border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:9px 12px}
.step .row{display:flex;align-items:flex-start;gap:10px}
.chk{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none;margin-top:1px;color:#fff;font-size:14px}
.step.ok{background:var(--green-soft);border-color:#B9D6C0}
.step.ok .chk{background:var(--green);border-color:var(--green)}
.step .tx{flex:1}
.step .acts{display:flex;gap:6px;flex:none}
.mini{font-size:12px;border:1px solid var(--line);background:var(--paper);border-radius:99px;padding:1px 9px}
.mini:hover{border-color:var(--accent);color:var(--accent-d)}
.hint{margin:6px 0 0 32px;font-size:13px;color:var(--accent-d);background:var(--accent-soft);border-radius:8px;padding:5px 9px}

.quiz{display:grid;gap:10px}
.q{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.q.ok{border-color:#B9D6C0}
.q p{font-weight:600;margin-bottom:8px}
.opts{display:grid;gap:6px}
.opt{text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:9px;padding:7px 11px;transition:.15s}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.opt.good{background:var(--green-soft);border-color:var(--green);font-weight:600}
.opt.bad{background:var(--warn-soft);border-color:var(--warn);text-decoration:line-through;color:var(--muted)}
.opt.tip{box-shadow:inset 3px 0 0 var(--green)}
.why{margin-top:8px;font-size:13px;color:var(--green);background:var(--green-soft);border-radius:8px;padding:6px 10px}
.btn{background:var(--accent);color:#fff;border-radius:10px;padding:8px 16px;font-weight:600}
.btn:hover{background:var(--accent-d)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.nextbar{display:flex;justify-content:space-between;gap:10px;margin-top:22px}

.builder{margin-top:10px;background:var(--card);border:1px dashed #D4B9A8;border-radius:var(--r);padding:12px;display:grid;gap:8px}
.builder label,.builder legend{font-size:13px;font-weight:600;color:var(--muted)}
.builder select,.builder textarea,.fld{width:100%;border:1px solid var(--line);border-radius:8px;padding:6px 9px;font:inherit;background:var(--paper);color:var(--ink)}
.builder fieldset{border:0;padding:0;margin:0;display:grid;gap:2px}
.builder fieldset label{font-weight:400;color:var(--ink);display:flex;gap:7px;align-items:center}
.cert{margin-top:18px;border:2px solid var(--accent);border-radius:14px;padding:16px;background:linear-gradient(135deg,#FFF8EE,#F9E7DA);text-align:center}
.cert h3{justify-content:center;font-family:var(--serif);font-size:20px;margin:0 0 4px!important}
.cert .big{font-family:var(--serif);font-size:34px;color:var(--accent-d)}
.cert input{max-width:260px;text-align:center;margin:8px 0}

/* ===== video player ===== */
.vwrap{border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--card);box-shadow:0 4px 18px rgba(60,40,20,.08)}
.vstage{position:relative;aspect-ratio:16/9;background:#FBF6EC;overflow:hidden;font-size:11px;color:var(--ink);user-select:none}
.vstage::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 1px 1px,#E3D8C4 1px,transparent 0) 0 0/1.6em 1.6em;opacity:.8}
.vscene{position:absolute;inset:0}
.vs{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:1.4em;padding:2.4em 3em 4.6em;flex-wrap:wrap}
.vi{opacity:0;transform:translateY(1.2em) scale(.97);transition:opacity .55s ease,transform .55s cubic-bezier(.2,.9,.3,1.2)}
.vi.in{opacity:1;transform:none}
.vs-t,.vs-y,.vs-l{flex-wrap:nowrap}
.vs-t{flex-direction:column;text-align:center;gap:.6em}
.vs-t>*{max-width:100%}
.vk{color:var(--accent-d);font-weight:700;font-size:1.6em;letter-spacing:.12em}
.vh{font-family:var(--serif);font-size:3.1em;line-height:1.3;font-weight:700;max-width:100%}
.vsub{font-size:1.7em;color:var(--muted)}
.vcol{width:15em;background:var(--card);border:.15em solid var(--line);border-radius:1em;padding:1.1em 1.1em 1.2em;display:flex;flex-direction:column;gap:.4em;text-align:center;align-items:center}
.vcol b{font-family:var(--serif);font-size:1.9em}
.vcol span{font-size:1.4em;color:var(--muted);line-height:1.4}
.vcol.hot{border-color:var(--accent);background:var(--accent-soft)}
.vcol.hot span{color:var(--ink)}
.vcol.bad{border-color:var(--warn);background:var(--warn-soft)}
.vcol.good{border-color:var(--green);background:var(--green-soft)}
.vcic{font-size:3.6em;color:var(--accent-d);line-height:1}
.vcol.bad .vcic{color:var(--warn)}.vcol.good .vcic{color:var(--green)}
.vbox{width:12.5em;background:var(--card);border:.15em solid var(--line);border-radius:1em;padding:1em;display:flex;flex-direction:column;align-items:center;gap:.3em;text-align:center}
.vbox svg{font-size:3.4em;color:var(--accent-d)}
.vbox b{font-size:1.6em;font-family:var(--serif)}
.vbox small{font-size:1.2em;color:var(--muted);line-height:1.35}
.varr{font-size:3em;color:var(--accent)}
.vnote{width:100%;text-align:center;font-size:1.7em;color:var(--accent-d);font-weight:600}
.vs-y{flex-direction:column}
.vcomp{width:44em;max-width:100%;background:var(--card);border:.15em solid var(--line);border-radius:1.2em;padding:1.1em 1.3em;box-shadow:0 .5em 1.6em rgba(60,40,20,.1);position:relative}
.vlab{font-size:1.2em;color:var(--muted);margin-bottom:.4em;font-weight:600}
.vtxt{font-size:1.75em;line-height:1.55;min-height:4.7em}
.vbtn{position:absolute;right:1em;bottom:1em;background:var(--accent);color:#fff;border-radius:.7em;padding:.3em 1em;font-size:1.4em;font-weight:700}
.vbtn.in{animation:vb 1s ease-in-out .3s 2}
@keyframes vb{50%{transform:scale(1.12)}}
.vs-l{flex-direction:column;align-items:flex-start;justify-content:center;gap:.7em;padding-left:9em}
.vlt{font-family:var(--serif);font-size:2.8em;font-weight:700;margin-bottom:.1em}
.vli{display:flex;align-items:center;gap:.7em;font-size:1.9em}
.vli i{width:1.4em;height:1.4em;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-size:.8em;font-style:normal}
.vs-d{gap:2em}
.vfiles{display:grid;gap:.45em}
.vf{display:flex;align-items:center;gap:.5em;background:var(--card);border:.12em solid var(--line);border-radius:.6em;padding:.3em .8em;font-size:1.35em}
.vf svg{color:var(--muted)}
.vproc{width:12em;text-align:center;display:grid;gap:.5em}
.vproc small{font-size:1.3em;color:var(--muted)}
.vbar{height:.9em;border-radius:9em;background:var(--line);overflow:hidden}
.vbar i{display:block;height:100%;width:calc(var(--p,0)*100%);background:var(--accent)}
.vout{display:flex;flex-direction:column;align-items:center;gap:.2em;background:var(--green-soft);border:.15em solid var(--green);border-radius:1em;padding:1em 1.4em;text-align:center}
.vout svg{font-size:3.6em;color:var(--green)}
.vout b{font-size:1.6em;font-family:var(--serif)}
.vout small{font-size:1.2em;color:var(--muted)}
.vcap{position:absolute;left:0;right:0;bottom:0;padding:.7em 1.4em;background:linear-gradient(transparent,rgba(43,42,39,.82));color:#fff;font-size:1.55em;line-height:1.45;text-align:center;min-height:2.6em;display:flex;align-items:flex-end;justify-content:center}
.vcap.off{display:none}
.vplay{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--accent);color:#fff;border-radius:99px;padding:.6em 1.5em;font-size:1.9em;font-weight:700;box-shadow:0 .4em 1.6em rgba(201,100,66,.5);z-index:2}
.vplay.hide{display:none}
.vctl{display:flex;align-items:center;gap:8px;padding:7px 10px;background:var(--paper);border-top:1px solid var(--line);font-size:13px}
.vctl{flex-wrap:wrap}
.vctl button{white-space:nowrap;border:1px solid var(--line);background:var(--card);border-radius:7px;padding:2px 9px;font-size:12px}
.vctl button.on{background:var(--inv);color:var(--inv-fg);border-color:var(--ink)}
.vctl .pp{width:30px;font-size:13px}
.vseek{flex:1;accent-color:var(--accent);min-width:0}
.vtime{font-variant-numeric:tabular-nums;color:var(--muted);min-width:76px;text-align:right}
.vwrap:fullscreen{display:flex;flex-direction:column;justify-content:center;background:#111}
.vwrap:fullscreen .vstage{aspect-ratio:auto;flex:1}

/* ===== simulator ===== */
.sim{flex:1;display:flex;flex-direction:column;background:var(--card);border:1px solid #D5CBB8;border-radius:14px;box-shadow:0 14px 44px rgba(60,40,20,.16);overflow:hidden;min-width:0;min-height:0;position:relative}
.sim-chrome{flex:none;height:46px;display:flex;align-items:center;gap:12px;padding:0 14px;background:var(--soft);border-bottom:1px solid var(--line)}
.dots{display:flex;gap:6px}.dots i{width:11px;height:11px;border-radius:50%;background:var(--soft2)}
.modes{margin:0 auto;display:flex;background:var(--soft2);border-radius:99px;padding:3px}
.modes button{padding:3px 20px;border-radius:99px;font-size:13px;font-weight:600;color:var(--muted)}
.modes button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.sim-badge{font-size:11px;color:var(--amber);background:var(--amber-soft);border-radius:99px;padding:1px 9px;white-space:nowrap}
.sim-body{flex:1;min-height:0;display:grid;grid-template-columns:196px 1fr}
.sb{background:var(--soft);border-right:1px solid var(--line);padding:10px;display:flex;flex-direction:column;gap:3px;overflow:auto;min-height:0}
.sb button{display:flex;align-items:center;gap:9px;text-align:left;border-radius:9px;padding:7px 10px;font-size:14px;width:100%}
.sb-new{background:var(--accent-soft);color:var(--accent-d);font-weight:700;margin-bottom:6px}
.sb-new:hover{background:#F0D2C3}
.sb-i:hover,.sb-t:hover{background:var(--soft2)}
.sb-i.on,.sb-t.on{background:var(--soft2);font-weight:600}
.sb-h{font-size:11px;color:var(--muted);margin:12px 10px 2px;letter-spacing:.06em}
.sb-empty{font-size:12px;color:var(--muted);padding:2px 10px}
.sb-t{font-size:13px!important}
.sb-t span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:#C9BFAE;flex:none}
.dot.running{background:var(--accent);animation:pl2 1.2s infinite}.dot.done{background:var(--green)}.dot.blocked{background:var(--amber)}
@keyframes pl2{50%{opacity:.3}}
.sb-foot{margin-top:auto;font-size:12px;color:var(--muted);padding:8px 10px;border-top:1px solid var(--line)}
.sb-foot b{color:var(--ink);display:block}
.sim-main{min-width:0;min-height:0;overflow:auto;display:flex;flex-direction:column}

.home{margin:auto;width:100%;max-width:640px;padding:22px 24px;display:grid;gap:18px}
.hello{display:flex;align-items:center;justify-content:center;gap:12px;font-family:var(--serif)}
.hello svg{font-size:30px;color:var(--accent)}
.hello h1{font-size:26px;font-weight:600}
.composer{border:1px solid #D8CDB9;border-radius:16px;background:var(--card);box-shadow:0 3px 14px rgba(60,40,20,.07);padding:10px 12px}
.composer:focus-within{border-color:var(--accent)}
.composer textarea{width:100%;border:0;resize:none;outline:0;font:inherit;min-height:74px;background:transparent}
.comp-bar{display:flex;align-items:center;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:3px 12px;font-size:13px}
.chip:hover{border-color:var(--accent)}
.chip.pri{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.chip.pri:hover{background:var(--accent-d)}
.chip.ghost{color:var(--muted)}
.chip.fold{background:var(--accent-soft);border-color:#EBC3AF;color:var(--accent-d);font-weight:600}
.grow{flex:1}
.send{width:34px;height:34px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:18px}
.send:hover{background:var(--accent-d)}
.sugg-h{font-size:13px;color:var(--muted)}
.sugg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sg{text-align:left;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--card);display:grid;gap:3px}
.sg:hover{border-color:var(--accent);background:var(--accent-soft)}
.sg svg{font-size:20px;color:var(--accent-d)}
.sg b{font-size:14px}.sg small{color:var(--muted);line-height:1.4}
.sg.dg svg{color:var(--warn)}

.task{flex:1;min-height:0;display:grid;grid-template-columns:1fr 236px}
.chat{overflow:auto;padding:14px 18px;display:flex;flex-direction:column;gap:12px;min-height:0}
.t-title{font-family:var(--serif);font-size:18px;font-weight:600;border-bottom:1px solid var(--line);padding-bottom:8px}
.m-u{align-self:flex-end;max-width:85%;background:var(--bubble);border-radius:14px 14px 4px 14px;padding:8px 13px;white-space:pre-wrap}
.m-c{display:flex;gap:10px;max-width:96%}
.m-c .av{width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent-d);display:grid;place-items:center;flex:none;font-size:15px}
.m-c ul{margin:6px 0 6px 18px;padding:0}
.m-btns{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.m-files{display:flex;gap:8px;flex-wrap:wrap;margin-left:36px}
.fchip{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:7px 12px;font-size:13px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.fchip:hover{border-color:var(--green);background:var(--green-soft)}
.fchip svg{color:var(--green);font-size:18px}
.perm{margin-left:36px;border:1.5px solid #E5C9A5;background:#FFF8EC;border-radius:12px;padding:10px 13px;display:grid;gap:3px}
.perm.danger{border-color:#E3A59C;background:#FDF0EE}
.perm.allow{opacity:.75}.perm.deny{opacity:.75}
.perm-h{display:flex;align-items:center;gap:7px;color:var(--amber)}
.perm.danger .perm-h{color:var(--warn)}
.perm small{color:var(--muted)}
.perm-b{display:flex;gap:8px;justify-content:flex-end;margin-top:4px}
.perm-r{font-size:13px;font-weight:600;color:var(--muted)}
.fup{margin-top:auto;border:1px solid #D8CDB9;border-radius:14px;display:flex;gap:8px;padding:6px 8px;align-items:center;position:sticky;bottom:0;background:var(--card)}
.fup textarea{flex:1;border:0;outline:0;resize:none;font:inherit;height:36px;padding-top:6px}
.rp{border-left:1px solid var(--line);background:var(--soft);padding:12px;overflow:auto;display:grid;gap:14px;align-content:start;min-height:0}
.rp h4{font-size:12px;color:var(--muted);letter-spacing:.06em;margin-bottom:6px}
.prog{list-style:none;margin:0;padding:0;display:grid;gap:7px;font-size:13px}
.prog li{display:flex;gap:8px;align-items:flex-start;line-height:1.4;color:var(--muted)}
.prog li i{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line);flex:none;display:grid;place-items:center;font-style:normal;font-size:12px;margin-top:1px}
.prog li.run{color:var(--ink);font-weight:600}.prog li.run i{border-color:var(--accent)}
.prog li.done{color:var(--ink)}.prog li.done i{background:var(--green);border-color:var(--green);color:#fff}
.prog li.skip{text-decoration:line-through}
.spin{width:8px;height:8px;border:2px solid var(--accent);border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.ff{font-size:12.5px;display:grid;gap:3px}
.ff div{display:flex;gap:6px;align-items:center;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:var(--muted)}
.ff div.new{color:var(--green);font-weight:600}
.ff b{color:var(--ink)}
.tag{font-size:11px;border-radius:99px;padding:0 8px;background:var(--line);color:var(--muted)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}.tag.ok{background:var(--green-soft);color:var(--green)}

.cust{padding:20px 24px;display:grid;gap:14px;align-content:start}
.cust h2,.sched h2{font-family:var(--serif);font-size:22px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tabs button{padding:6px 14px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent}
.tabs button.on{color:var(--accent-d);border-color:var(--accent)}
.list{display:grid;gap:8px}
.item{border:1px solid var(--line);border-radius:12px;padding:11px 13px;display:flex;align-items:center;gap:12px;background:var(--card)}
.item .ic{width:36px;height:36px;border-radius:9px;background:var(--accent-soft);color:var(--accent-d);display:grid;place-items:center;font-size:19px;flex:none}
.item .mid{flex:1;min-width:0}.item small{color:var(--muted);display:block;line-height:1.4}
.item .det{margin-top:6px;font-size:12.5px;background:var(--paper);border-radius:8px;padding:6px 10px}
.sw{width:40px;height:22px;border-radius:99px;background:#D2C8B6;position:relative;transition:.2s;flex:none}
.sw::after{content:"";position:absolute;left:2px;top:2px;width:18px;height:18px;border-radius:50%;background:var(--card);transition:.2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.sw.on{background:var(--green)}.sw.on::after{left:20px}
.sched{padding:20px 24px;display:grid;gap:14px;align-content:start}
.note{font-size:13px;color:var(--amber);background:var(--amber-soft);border-radius:10px;padding:8px 12px}
.empty{border:1px dashed #CFC4AF;border-radius:12px;padding:22px;text-align:center;color:var(--muted)}
.modeNote{margin:auto;max-width:460px;text-align:center;padding:30px;display:grid;gap:10px;justify-items:center}
.modeNote svg{font-size:40px;color:var(--accent)}
.modeNote h2{font-family:var(--serif)}
.bubble{background:var(--bubble);border-radius:12px;padding:7px 14px;font-size:13px}

/* modal */
.modal-bg{position:absolute;inset:0;background:rgba(43,42,39,.42);display:grid;place-items:center;z-index:20;padding:14px;animation:fi .15s}
@keyframes fi{from{opacity:0}}
.modal{background:var(--card);border-radius:16px;width:min(620px,100%);max-height:100%;overflow:auto;padding:18px 20px;position:relative;box-shadow:0 20px 60px rgba(0,0,0,.3);display:grid;gap:10px}
.modal h3{font-family:var(--serif);font-size:19px;padding-right:26px}
.modal .x{position:absolute;right:12px;top:10px;font-size:22px;color:var(--muted);line-height:1}
.modal .foot{display:flex;justify-content:flex-end;gap:8px;margin-top:4px}
.fp{display:grid;grid-template-columns:230px 1fr;gap:12px;min-height:250px}
.fp .l{display:grid;gap:6px;align-content:start}
.frow{text-align:left;border:1px solid var(--line);border-radius:10px;padding:7px 10px;display:flex;gap:9px;align-items:center}
.frow:hover{border-color:var(--accent)}.frow.on{background:var(--accent-soft);border-color:var(--accent)}
.frow small{display:block;color:var(--muted);font-size:11.5px;line-height:1.3}
.frow svg{font-size:20px;color:var(--accent-d)}
.fp .r{border:1px solid var(--line);border-radius:10px;padding:10px;font-size:13px;background:var(--paper);display:flex;flex-direction:column;gap:6px}
.fp .r .fl{display:grid;gap:2px;color:var(--muted);flex:1}
.warnbar{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:5px 9px;font-weight:600;font-size:12.5px}
.xl{border-collapse:collapse;width:100%;font-size:13px}
.xl th{background:#E8F0E8;border:1px solid #CBD8CB;padding:3px 8px;text-align:left}
.xl td{border:1px solid #E4E4E4;padding:3px 8px}
.xl .bad td{background:var(--warn-soft);color:var(--warn);font-weight:600}
.xl .warn td{background:var(--amber-soft);color:var(--amber)}
.xl td.r{text-align:right;font-variant-numeric:tabular-nums}
.md{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:13.5px;white-space:pre-wrap;line-height:1.7}
.mail{border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px;background:var(--card);display:grid;gap:2px}
.mail .tag{justify-self:start}
.lbl{display:grid;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
.lbl .fld{font-weight:400;color:var(--ink)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}

#toasts{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);display:grid;gap:8px;z-index:100;pointer-events:none;width:min(520px,92vw)}
.toast{background:var(--inv);color:var(--inv-fg);border-radius:12px;padding:9px 15px;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:ti .3s;text-align:center}
.toast.ok{background:var(--green)}.toast.warn{background:var(--warn)}
@keyframes ti{from{opacity:0;transform:translateY(12px)}}
.pulse{outline:3px solid var(--accent)!important;outline-offset:3px;animation:pl 1s ease-in-out 4;border-radius:10px;position:relative;z-index:5}
@keyframes pl{50%{outline-color:transparent;box-shadow:0 0 0 9px rgba(201,100,66,.28)}}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:200}

@media (max-width:1000px){
 .layout{grid-template-columns:1fr}
 .coach,.stage{display:none}
 body[data-pane="coach"] .coach{display:block}
 body[data-pane="sim"] .stage{display:flex}
 .panes{display:flex;gap:4px}
 .pbar{display:none}
 .topbar{overflow:hidden}
 .topbar{gap:8px;padding:0 10px}.brand small{display:none}
 .sim-body{grid-template-columns:1fr}.sb{display:none}
 .task{grid-template-columns:1fr}.rp{border-left:0;border-top:1px solid var(--line)}
 .fp{grid-template-columns:1fr}.sugg{grid-template-columns:1fr}
}
@media (max-width:700px){.brand>div:last-child,.score{display:none}.tspacer{display:none}.topbar{justify-content:space-between}}
@media (prefers-reduced-motion:reduce){
 .kcard>div,.pbar i,.sw,.sw::after{transition:none}
 .pulse,.spin,.dot.running,.vbtn.in{animation:none}
 html{scroll-behavior:auto}.coach{scroll-behavior:auto}
}

/* ===== 檢視切換 ===== */
.vsw{display:flex;background:var(--soft2);border-radius:99px;padding:3px;margin-left:6px}
.vsw button{padding:3px 14px;border-radius:99px;font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap}
.vsw button.on{background:var(--inv);color:var(--inv-fg)}
.view{display:none;flex:1;min-height:0}
body[data-view="map"] #view-map{display:flex;flex-direction:column}
body[data-view="layers"] #view-layers,body[data-view="overview"] #view-overview{display:block;overflow:auto}
body:not([data-view="learn"]) .layout{display:none}
body:not([data-view="learn"]) .pbar,body:not([data-view="learn"]) .score,body:not([data-view="learn"]) #teacher,body:not([data-view="learn"]) [data-act="reset"],body:not([data-view="learn"]) .panes{display:none!important}

/* ===== 心智圖 ===== */
.mmbar{flex:none;display:flex;align-items:center;gap:10px;padding:8px 16px;border-bottom:1px solid var(--line);background:var(--paper);flex-wrap:wrap}
.mtabs{display:flex;gap:6px;overflow-x:auto;flex:1;min-width:0}
.mtab{flex:none;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:3px 14px;font-size:14px;white-space:nowrap}
.mtab.on{background:var(--inv);color:var(--inv-fg);border-color:var(--ink);font-weight:600}
.mmtools{display:flex;gap:6px}
.mmtools button{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:3px 11px;font-size:13px;white-space:nowrap}
.mmtools button:hover{border-color:var(--accent)}
.mmlegend{flex:none;margin:0;padding:6px 16px;font-size:13px;color:var(--muted);background:var(--soft);border-bottom:1px solid var(--line)}
.mmlegend .r{color:#B4382B}.mmlegend .g{color:var(--green)}
#mmv{position:relative;flex:1;min-height:0;overflow:hidden;touch-action:none;cursor:grab;background:var(--mmbg);outline:0}
#mmv.grab{cursor:grabbing}
#mmc{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
#mmsvg{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
#mmsvg path{fill:none;stroke-width:2.4;stroke-linecap:round}
#mmsvg path.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:dr .6s ease forwards}
@keyframes dr{to{stroke-dashoffset:0}}
.mn{position:absolute;padding:0 4px 11px 2px;user-select:none;-webkit-user-select:none}
.mn.has{cursor:pointer}
.mn.born{animation:bn .4s ease both}
@keyframes bn{from{opacity:0;transform:translateX(-14px)}}
.mn.flash{animation:fl 1.1s ease 2}
@keyframes fl{50%{background:rgba(201,100,66,.22);border-radius:10px}}
.mn-h{display:flex;align-items:center;gap:8px}
.mn-h b{font-size:17px;line-height:1.35}
.mn-h .px{flex:none}
.num{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--inv);color:var(--inv-fg);font-size:12px;font-style:normal;margin-right:6px;vertical-align:1px}
.mn-d{margin:2px 0 0;color:var(--muted);font-size:14px;line-height:1.55}
.mn-box{position:relative;margin-top:16px;background:var(--card);border:2px solid;padding:6px 10px;font-size:14px;font-weight:600;line-height:1.45}
.mn-box::before{content:"";position:absolute;left:14px;top:-11px;width:8px;height:9px;background:var(--c);clip-path:polygon(0 0,100% 0,100% 40%,45% 40%,45% 100%,0 100%)}
.mn-red{display:flex;gap:6px;align-items:flex-start;margin-top:7px;color:#B4382B;font-size:13.5px;font-weight:700;line-height:1.45}
.mn-red .px{margin-top:2px}
.mn-go{margin-top:7px;font-size:13px;font-weight:700;border:1.5px solid currentColor;border-radius:99px;padding:0 10px;background:var(--card)}
.mn-go:hover{background:var(--accent-soft)}
.mn-t{position:absolute;right:-9px;bottom:-10px;width:18px;height:18px;border-radius:50%;background:var(--c);border:2.5px solid var(--c);padding:0}
.mn.has .mn-t{box-shadow:0 0 0 4px rgba(255,255,255,.01)}
.mn.has.open .mn-t{background:var(--card)}
.mn:not(.has) .mn-t{width:12px;height:12px;right:-6px;bottom:-6px;pointer-events:none}
.mn:focus-visible{outline:2px solid var(--blue);border-radius:8px}

/* ===== 分層卡片 / 全景 ===== */
.vwrap2{max-width:760px;margin:0 auto;padding:22px 18px 80px}
.lytabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px}
.lytabs button{flex:none;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:3px 14px;font-size:14px;white-space:nowrap}
.lytabs button.on{background:var(--inv);color:var(--inv-fg);border-color:var(--ink)}
.lyh{font-size:28px;line-height:1.3}
.lys{color:var(--muted);margin:2px 0 4px;font-size:16px}
.lyhint{color:var(--muted);font-size:13.5px;margin-bottom:14px}
.ly{display:grid;gap:8px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.g2{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.g2s{display:grid;grid-template-columns:1fr 1.6fr;gap:10px}
.bk{position:relative;text-align:left;background:var(--card);border:3px solid;border-radius:16px;padding:10px 14px;display:grid;gap:2px;align-content:center;transition:transform .15s,box-shadow .15s}
.bk b{font-size:17px;line-height:1.35}
.bk small{color:var(--muted);font-size:13.5px;line-height:1.45}
.bk::after{content:"↗";position:absolute;right:10px;top:5px;color:var(--muted);font-size:12px}
.bk:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(60,40,20,.12)}
.bk.bl{border-color:#3B5FA8}.bk.br{border-color:#A0522D}.bk.gr{border-color:#3E7C59}
.bk.tall{min-height:150px}.bk.wide{text-align:center}
.dash{border:2px dashed #A0522D;border-radius:18px;padding:8px 10px 10px;display:grid;gap:8px}
.dash .cap{font-size:14px;font-weight:600}
.av{display:flex;align-items:center;justify-content:center;gap:6px;color:var(--muted);font-size:13.5px}
.av span{font-size:20px;color:var(--muted)}
.bk.big{padding:12px 14px 14px}
.bk.big .bic{margin-bottom:2px}
.bk.big em{font-style:normal;font-size:13px;font-weight:600;margin-top:4px;border-top:1.5px dashed var(--line);padding-top:5px}
.chain{gap:0}
.dn{text-align:center;color:var(--muted);font-size:18px;line-height:1.1;padding:2px 0}
.bk.step{display:flex;align-items:center;gap:12px;padding:9px 14px}
.bk.step .sn{width:26px;height:26px;border-radius:50%;color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
.bk.step .stx{display:grid;flex:1;min-width:0}
.bk.step .rd{display:flex;gap:5px;align-items:center;color:#B4382B;max-width:38%}
.bk.step .rd small{color:#B4382B;font-weight:700;font-size:12.5px}
.lynav{display:flex;justify-content:space-between;margin-top:18px}
.ovl{margin-top:34px;padding-top:6px;border-top:2px solid var(--line)}
.ovl h3{font-family:var(--serif);font-size:22px}
.mapcards .bk{padding:12px 14px}

/* ===== 細節面板 ===== */
.sheet-bg{position:fixed;inset:0;background:rgba(43,42,39,.45);z-index:150;display:grid;align-items:end;justify-items:center;animation:fi .15s}
.sheet-bg[hidden]{display:none}
.sheet{position:relative;background:var(--card);width:min(560px,100%);border-radius:20px 20px 0 0;padding:20px 22px 24px;display:grid;gap:10px;max-height:82vh;overflow:auto;animation:su .25s ease}
@keyframes su{from{transform:translateY(40px);opacity:.5}}
@media (min-width:700px){.sheet-bg{align-items:center}.sheet{border-radius:20px}}
.sheet .x{position:absolute;right:14px;top:10px;font-size:26px;color:var(--muted);line-height:1}
.sh-h{display:flex;align-items:center;gap:10px}
.sh-h h3{font-family:var(--serif);font-size:24px}
.sh-d{font-size:16px}
.sh-box{border:2px solid var(--ink);padding:7px 11px;font-weight:600;background:#FBF8F2}
.sh-red{display:flex;gap:7px;align-items:flex-start;color:#B4382B;font-weight:700;background:var(--warn-soft);border-radius:10px;padding:8px 11px}
.sh-m{font-size:14px;color:var(--muted)}
.sh-k{margin:0;padding-left:18px;font-size:14.5px;display:grid;gap:3px}
.sh-b{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}

@media (max-width:1000px){
 .vsw button{padding:3px 9px;font-size:12.5px}
 .vsw{margin-left:0}
 .g3{grid-template-columns:1fr 1fr}.g2s{grid-template-columns:1fr}
 .bk.step .rd{display:none}
 .mmlegend{font-size:12px}
}
@media (max-width:700px){
 .brand b{display:none}
 .topbar{padding:0 8px;justify-content:space-between}
 .mn-h b{font-size:16px}
 .lyh{font-size:23px}
}
@media (prefers-reduced-motion:reduce){.mn.born,.mn.flash,#mmsvg path.draw,.sheet,.sheet-bg{animation:none}#mmsvg path.draw{stroke-dashoffset:0}}
.fup textarea,.composer textarea,.fld{background:transparent;color:inherit}
.fld{background:var(--paper)}

/* ===== 課程閱讀器 ===== */
.coach{display:flex;flex-direction:column;overflow:hidden;padding:12px 16px 12px;scroll-behavior:auto}
.rd-top{flex:none;display:flex;align-items:center;gap:10px;padding:2px 2px 10px;border-bottom:var(--bw) solid var(--line)}
.icon-btn{width:40px;height:40px;border-radius:11px;border:var(--bw) solid var(--line);background:var(--accent-soft);display:grid;place-items:center;font-size:18px;flex:none}
.rd-title{flex:1;min-width:0}
.rd-title b{font-family:var(--font-head);font-size:16px;display:block;line-height:1.25}
.rd-title small{color:var(--muted);font-size:12.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rd-count{font-weight:700;font-size:13px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.rd-body{flex:1;min-height:0;overflow:auto;padding:12px 4px 18px 2px;scroll-behavior:smooth}
.rd-foot{flex:none;display:flex;align-items:center;gap:10px;padding-top:10px;border-top:var(--bw) solid var(--line)}
.circ{width:48px;height:48px;border-radius:50%;border:3px solid var(--line);background:var(--card);font-size:28px;line-height:1;display:grid;place-items:center;flex:none;padding-bottom:4px;transition:transform .1s,box-shadow .1s}
.circ:hover:not(:disabled){background:var(--accent-soft)}
.circ:disabled{opacity:.35;cursor:not-allowed}
.circ.go{background:var(--accent);color:#fff}
.segs{flex:1;display:flex;gap:7px;min-width:0}
.sgrp{display:flex;gap:2px;flex:1;min-width:0}
.seg{flex:1;height:14px;border-radius:3px;border:2px solid var(--line);background:var(--card);padding:0;min-width:3px;transition:background .3s}
.seg.done{background:var(--green)}
.seg.cur{background:var(--accent);flex:1.6}
.seg.lock{opacity:.35}
.rd-tag{display:flex;gap:8px;flex-wrap:wrap}
.chip2{display:inline-flex;align-items:center;gap:6px;background:var(--green-soft);border:var(--bw) solid var(--line);border-radius:99px;padding:1px 12px;font-weight:700;font-size:13px}
.chip2.b{background:var(--blue-soft)}.chip2.y{background:var(--amber-soft)}
.rd-h{font-family:var(--font-head);font-size:26px;line-height:1.3;font-weight:800;margin:8px 0 6px}
.rd-meta{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:13px;margin-bottom:10px}
.tip{display:flex;gap:10px;align-items:flex-start;background:var(--amber-soft);border:var(--bw) solid var(--line);border-radius:12px;padding:9px 12px;margin:6px 0 14px;font-size:14.5px}
.tip .px{margin-top:2px;flex:none}
.rd-sec{font-size:15px;font-weight:800;margin:20px 0 8px;display:flex;align-items:center;gap:8px}
.rd-sec em{font-style:normal;font-size:12px;font-weight:600;color:var(--muted);background:var(--card);border:var(--bw) solid var(--line);border-radius:99px;padding:0 8px}
.rd-body .goal{margin:0 0 10px}
.sample{border:2px dashed var(--muted);border-radius:12px;padding:10px 14px;background:var(--soft);font-size:14px;line-height:1.8;margin:10px 0}
.sample b{color:var(--muted);font-size:13px;display:block}
.pcard{border:3px solid var(--line);border-radius:14px;overflow:hidden;background:var(--card);margin:12px 0}
.pcard .ph{display:flex;align-items:center;gap:8px;padding:6px 12px;background:#FAE8A0;border-bottom:3px solid var(--line);font-weight:800;font-size:14px;color:#2B2A27}
.pcard.dg .ph{background:#FFC7C0}
.pcard .ph .grow{flex:1}
.pcard .pb{padding:12px 14px;white-space:pre-wrap;line-height:1.75;font-size:14.5px}
.pcard .pa{display:flex;gap:8px;padding:0 12px 12px;flex-wrap:wrap}
.mini.solid{background:var(--ink);color:var(--card);border-color:var(--ink)}
.menu-list{display:grid;gap:8px;margin-top:6px}
.menu-list button{display:flex;align-items:center;gap:10px;text-align:left;border:var(--bw) solid var(--line);border-radius:12px;padding:8px 12px;background:var(--card)}
.menu-list button:hover{background:var(--accent-soft)}
.menu-list .n{width:28px;height:28px;border-radius:50%;background:var(--soft2);display:grid;place-items:center;font-weight:800;flex:none}
.menu-list .on .n{background:var(--accent);color:#fff}.menu-list .done .n{background:var(--green);color:#fff}
.menu-list small{color:var(--muted);display:block}
.menu-list .lock{opacity:.5}

/* ===== 影片（海報貼紙風）===== */
.vdots{position:absolute;right:1.2em;top:1.1em;z-index:2;display:flex;gap:.45em;align-items:center}
.vdots i{width:.9em;height:.9em;border-radius:50%;border:.14em solid var(--ink);background:var(--card)}
.vdots i.on{background:var(--accent)}
.vs-t{background:var(--accent-soft);color:var(--ink);align-items:flex-start;justify-content:center;padding:2.4em 4em 6.2em;gap:.55em;overflow:hidden}
.vblob{position:absolute;border-radius:50%;border:.2em solid var(--ink);pointer-events:none}
.vblob.b1{width:15em;height:15em;right:-3em;top:-2.5em;background:#FFE08A}
.vblob.b2{width:9em;height:9em;right:6em;bottom:2.4em;background:#B9A8FF}
.vblob.b3{width:4em;height:4em;right:15em;top:3em;background:var(--card)}
.vs-t .vk{color:var(--ink);font-weight:800;font-size:1.5em;letter-spacing:.08em;display:flex;align-items:center;gap:.6em}
.vs-t .vk::before{content:"";width:2.2em;height:.2em;background:var(--ink);display:block}
.vs-t .vh{color:var(--ink);font-family:var(--font-head);font-size:3.3em;font-weight:900;text-align:left;max-width:75%;position:relative}
.vs-t .vsub{color:var(--ink);opacity:.8;text-align:left;font-size:1.65em;position:relative;max-width:75%}
.vtags{display:flex;gap:.7em;flex-wrap:wrap;margin-top:1em;position:relative}
.vtags b{background:var(--card);border:.15em solid var(--ink);border-radius:.5em;padding:.25em .9em;font-size:1.45em;box-shadow:.2em .2em 0 var(--ink)}
.vtags b:nth-child(odd){transform:rotate(-2deg)}.vtags b:nth-child(even){transform:rotate(1.5deg)}
.vcol.hot,.vout,.vcomp{box-shadow:.35em .35em 0 var(--accent)}
.vs-r{flex-direction:row!important;flex-wrap:wrap!important;align-content:center;justify-content:center;gap:1.1em!important;padding:4.2em 4em 5.4em!important}
.vs-r .vlt{width:100%;text-align:center;font-size:2.5em;font-family:var(--font-head);font-weight:900;margin:0 0 .1em}
.vcard{width:20em;min-height:5.6em;display:block;background:var(--amber-soft);border:.14em solid var(--ink);border-radius:.4em .4em .4em 1.4em;padding:.7em 1em;box-shadow:.25em .25em 0 var(--ink);transition:transform .35s,background .35s}
.vcard:nth-of-type(odd){transform:rotate(-1.4deg)}.vcard:nth-of-type(even){transform:rotate(1.2deg)}
.vcard .vn{display:inline-block;font-size:1.25em;font-weight:900;margin-right:.4em;color:var(--accent-d)}
.vcard .vct{display:inline}
.vcard b{font-size:1.75em;display:inline;line-height:1.3;background:linear-gradient(transparent 62%,transparent 62%);transition:background .4s}
.vcard small{display:block;font-size:1.3em;color:var(--muted);margin-top:.15em}
.vcard.on{transform:rotate(0) scale(1.05)!important;background:var(--card)}
.vcard.on b{background:linear-gradient(transparent 62%,var(--accent) 62%)}
.vcap{background:none!important;padding:.8em 1.4em!important;justify-content:center!important;align-items:flex-end!important}
.vcap span{background:var(--card);color:var(--ink);padding:.3em .9em;border:.14em solid var(--ink);border-radius:.6em;box-shadow:.25em .25em 0 var(--ink);font-weight:700;line-height:1.5}
.vcap:empty,.vcap span:empty{display:none}
.vplay{left:auto!important;right:7%;top:50%!important;transform:translateY(-50%)!important}
.vplay:active{transform:translateY(-50%) scale(.96)!important}
@media (max-width:700px){.brand{display:none}}

.mq{background:var(--card);border:var(--bw) solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px}
.mq.ok{background:var(--green-soft)}
.mq p{font-weight:700;margin-bottom:8px;display:flex;gap:8px;align-items:flex-start}
.mn2{width:22px;height:22px;border-radius:50%;background:var(--inv);color:var(--inv-fg);display:grid;place-items:center;font-size:12px;flex:none;margin-top:2px}
.mopts{display:flex;gap:8px;flex-wrap:wrap}
.mopts .opt{padding:5px 14px;font-weight:600}
.gloss{display:grid;gap:10px;margin-top:8px}
.gl{border:var(--bw) solid var(--line);border-radius:12px;padding:9px 12px;background:var(--card)}
.gl b{font-size:17px;font-family:var(--font-head)}
.gl .gs{margin-left:8px;background:var(--amber-soft);border-radius:99px;padding:0 10px;font-size:13px;font-weight:700}
.gl p{margin:4px 0 2px;font-size:14.5px}.gl em{font-style:normal;font-size:13px;color:var(--muted)}

/* ===== 名詞辭典 ===== */
body[data-view="gloss"] #view-gloss{display:block;overflow:auto}
.vwrap2.wide{max-width:1040px}
.gsearch{position:relative;margin:10px 0}
.gsearch input{width:100%;padding:12px 70px 12px 44px;font-size:17px;border:var(--bw) solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);font-family:inherit}
.gsearch::before{content:"⌕";position:absolute;left:15px;top:50%;transform:translateY(-54%);font-size:22px;color:var(--muted)}
.gcount{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:13px;color:var(--muted)}
.gcats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.gcats button{border:var(--bw) solid var(--line);background:var(--card);border-radius:99px;padding:3px 14px;font-size:14px}
.gcats button.on{background:var(--inv);color:var(--inv-fg)}
.ggrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.gcard{display:flex;gap:12px;background:var(--card);border:var(--bw) solid var(--line);border-radius:16px;padding:12px}
.gbody{min-width:0}
.gh{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.gh b{font-size:18px;font-family:var(--font-head)}
.gs{background:var(--amber-soft);border-radius:99px;padding:0 10px;font-size:13px;font-weight:700}
.gcard p{margin:4px 0;font-size:14.5px}
.gcard em{font-style:normal;color:var(--muted);font-size:13px;display:block}
.gbtn{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
mark{background:#FFE066;color:#171717;border-radius:3px;padding:0 1px}
.gnote{margin-top:18px;font-size:13px;color:var(--muted)}
.gnote a{color:var(--blue)}
@media (max-width:700px){.ggrid{grid-template-columns:1fr}.gcard{flex-direction:column;align-items:flex-start}}

/* 小動畫：每次 5 秒重播（JS 重置），減少動態時顯示最終畫面 */
.ga{width:116px;height:86px;flex:none;border:var(--bw) solid var(--line);border-radius:14px;background:var(--soft);display:grid;place-items:center;cursor:pointer}
.ga svg{width:96px;height:72px;overflow:visible}
.ga *{transform-box:fill-box;transform-origin:center}
.ga .ln{stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ga .stk{stroke:var(--green);stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;fill:none}
.ga .fc{fill:var(--card)}.ga .fs{fill:var(--soft2)}.ga .fa{fill:var(--accent)}.ga .fg{fill:var(--green)}.ga .fb{fill:var(--blue)}.ga .fy{fill:#FFD35A}.ga .fi{fill:var(--ink);opacity:.7}
.ga .none{fill:none;stroke:var(--muted);stroke-width:2}.ga .dashed{stroke-dasharray:4 4}
.ga .ghost{opacity:.3}
.ga .pop{animation:gpop .5s ease var(--dl,0s) both}
.ga .slide{animation:gdrop .6s ease var(--dl,0s) both}
.ga .slide2{animation:gright .6s ease var(--dl,0s) both}
.ga .type{transform-origin:left center;animation:gtype .8s ease var(--dl,0s) both}
.ga .blink{animation:gblink 1s steps(2) infinite}
.ga .pulse{animation:gpulse 1.6s ease-in-out var(--dl,0s) infinite}
.ga .plug{animation:gplug 1.3s ease both}
.ga .spark{animation:gpop .4s ease 1.3s both}
.ga .hand{transform-box:view-box;transform-origin:34px 36px;animation:gspin 4s linear both}
.ga .lid{animation:glid 3.6s ease both}
.ga .drop{animation:gfall .8s ease var(--dl,0s) both}
.ga .chip{animation:gchip .5s ease var(--dl,0s) both}
.ga .hl{animation:ghl 3.2s ease-in-out both}
.ga .meter{transform-origin:left center;animation:gtype 3s linear both}
.ga .paper{animation:gpaper .5s ease var(--dl,0s) both}
.ga .paper.out{animation:gpaperout 4s ease both}
@keyframes gpop{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:none}}
@keyframes gdrop{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}
@keyframes gright{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:none}}
@keyframes gtype{from{transform:scaleX(0);opacity:.2}to{transform:scaleX(1);opacity:.7}}
@keyframes gblink{50%{opacity:0}}
@keyframes gpulse{50%{transform:scale(1.07)}}
@keyframes gplug{from{transform:translateX(-22px)}to{transform:none}}
@keyframes gspin{to{transform:rotate(360deg)}}
@keyframes glid{0%{transform:none}12%,70%{transform:translateY(-7px) rotate(-3deg)}100%{transform:none}}
@keyframes gfall{from{opacity:0;transform:translateY(-16px)}to{opacity:1;transform:translateY(24px)}}
@keyframes gchip{from{opacity:0;transform:translateX(-12px) scale(.8)}to{opacity:1;transform:none}}
@keyframes ghl{0%{transform:translateX(0)}35%{transform:translateX(29px)}70%{transform:translateX(58px)}100%{transform:translateX(0)}}
@keyframes gpaper{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}
@keyframes gpaperout{0%{opacity:0;transform:translateY(-14px)}12%,62%{opacity:1;transform:none}100%{opacity:0;transform:translateX(-26px)}}
@media (prefers-reduced-motion:reduce){.ga *{animation:none!important}}

/* ===== 換膚按鈕 / 貼紙 / 裝飾 ===== */
.skins{display:flex;gap:6px;align-items:center}
.skins button{width:24px;height:24px;border-radius:50%;background:var(--c);border:2px solid var(--line);padding:0;position:relative}
.skins button.on{outline:3px solid var(--accent);outline-offset:2px}
.skins button::after{content:attr(title);position:absolute;top:30px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--card);font-size:11px;padding:1px 8px;border-radius:6px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s;z-index:60}
.skins button:hover::after{opacity:1}
.sticker,.deco{display:none}
.stage{position:relative}
.sim{z-index:1}

function toast(msg,kind){
 const box=$('#toasts');if(!box)return;
 const d=document.createElement('div');d.className='toast '+(kind||'');d.textContent=msg;box.appendChild(d);
 setTimeout(()=>d.remove(),kind==='ok'?2600:3600);
 while(box.children.length>3)box.firstChild.remove();
}
function pulse(sel){
 $$('.pulse').forEach(e=>e.classList.remove('pulse'));
 const el=$(sel);if(!el)return false;
 el.classList.add('pulse');el.scrollIntoView({block:'nearest',behavior:'smooth'});
 setTimeout(()=>el.classList.remove('pulse'),4500);return true;
}

function renderSim(){
 const root=$('#sim');if(!root)return;
 const a=document.activeElement,keep=a&&a.id==='composer'?a.selectionStart:null;
 const old=$('#chat');const wasBottom=!old||old.scrollHeight-old.scrollTop-old.clientHeight<80;
 root.innerHTML=simChrome()+`<div class="sim-body">${sidebar()}<main class="sim-main">${main()}</main></div>`+modalHtml();
 const c=$('#chat');if(c&&wasBottom)c.scrollTop=c.scrollHeight;
 if(keep!==null){const n=$('#composer');if(n){n.focus();try{n.setSelectionRange(keep,keep)}catch(e){}}}
}

/* ========== 任務執行 ========== */
function pickScenario(p){
 for(const id of ['delete','dunning','bank','invoices'])if(SCEN[id].re.test(p))return SCEN[id];
 return SCEN.generic;
}
function sendPrompt(){
 const p=S.prompt.trim();
 if(!p){toast('請先輸入任務內容，或點下方的建議卡片');return}
 if(S.view==='task'&&S.active){ // 追問
  const k=S.tasks.find(x=>x.id===S.active);
  if(k&&k.status==='done'){k.msgs.push({r:'u',t:p});S.prompt='';renderSim();emit('followup');
   setTimeout(()=>{k.msgs.push({r:'c',t:'收到！我會依你的補充調整並更新輸出檔案。<br><small style="color:var(--muted)">（教學模擬：此處不會真的修改檔案）</small>'});renderSim()},800);return}
  if(k&&(k.status==='running')){toast('Claude 還在工作中，等這個任務完成再追問');return}
 }
 const sc=pickScenario(p);
 const k={id:++_uid,title:p.length>16?p.slice(0,16)+'…':p,prompt:p,folder:S.folder,sc,status:'plan',steps:[],msgs:[{r:'u',t:p}],out:[],_i:0,pending:null};
 S.tasks.unshift(k);S.active=k.id;S.view='task';S.prompt='';
 const f=S.folder?FOLDERS[S.folder]:null;
 let block=null;
 if(f&&f.sens)block={t:`⚠ 我看到授權的「${f.name}」含有薪資單與身分證，和這個任務無關。<b>建議改授權較小、較單純的資料夾</b>，再重新送出。`,ev:'send_sensitive'};
 else if(sc.id!=='dunning'&&sc.id!=='generic'&&!f)block={t:'我還沒有任何資料夾的存取權限。請先<b>選擇資料夾</b>，我才能讀取資料。',ev:'send_no_folder'};
 else if(sc.folder&&S.folder!==sc.folder)block={t:`這個任務需要「${FOLDERS[sc.folder].name}」的資料，但目前授權的是「${f.name}」，裡面沒有相關檔案。請改選資料夾後重新送出。`,ev:'send_mismatch'};
 if(block){k.status='blocked';S.prompt=p;k.msgs.push({r:'c',t:block.t,btn:[{act:'folder-open',l:'選擇資料夾'}]});renderSim();emit(block.ev);return}
 runTask(k);
}
function runTask(k){
 let sc=k.sc,variant=sc.id;
 let steps=sc.steps.map(s=>({...s}));
 if(sc.id==='dunning'){
  if(S.conn.gmail){variant='dunning_gmail';steps[2].t='在 Gmail 建立 3 封草稿（不會自動寄出）';k.out=[{name:'Gmail 草稿 ×3',type:'gmail',pv:'gmail'}]}
  else{steps[2].t='沒有連接 Gmail，改存成檔案：催款信草稿.md';k.out=[{name:'催款信草稿.md',type:'md',pv:'dunning'}]}
 }else k.out=sc.out.map(o=>({...o}));
 k.variant=variant;k.steps=steps.map(s=>({t:s.t,st:'todo',perm:s.perm}));k.status='running';k._i=0;
 k.msgs.push({r:'c',t:'好的，我先擬定計畫，再依序執行。你可以隨時在右側「<b>進度</b>」看到我做到哪一步。'});
 renderSim();emit('task_started:'+sc.id);
 advance(k);
}
function advance(k){
 if(!S.tasks.includes(k))return;
 if(k._i>=k.steps.length)return finish(k);
 const st=k.steps[k._i];st.st='run';renderSim();
 setTimeout(()=>{
  if(!S.tasks.includes(k))return;
  if(st.perm&&S.pmode!=='manual'&&st.perm.kind!=='delete'){
   k.msgs.push({r:'c',t:'<small style="color:var(--muted)">（'+(S.pmode==='auto'?'自動':'全部略過')+'模式：已自動批准「'+st.perm.text+'」）</small>'});st.st='done';k._i++;renderSim();emit('perm_auto:'+st.perm.kind);advance(k);return}
  if(st.perm){k.pending={i:k._i};k.msgs.push({r:'perm',perm:st.perm,state:'ask'});renderSim();emit('perm_asked:'+st.perm.kind);return}
  st.st='done';k._i++;renderSim();advance(k);
 },1000);
}
function respondPerm(ok){
 const k=S.tasks.find(x=>x.id===S.active);if(!k||!k.pending)return;
 const m=[...k.msgs].reverse().find(x=>x.r==='perm'&&x.state==='ask');if(!m)return;
 const kind=m.perm.kind,st=k.steps[k.pending.i];
 m.state=ok?'allow':'deny';k.pending=null;k.denied=k.denied||{};k.denied[kind]=!ok;
 st.st=ok?'done':'skip';k._i++;
 if(!ok&&kind==='delete'){k.steps.slice(k._i).forEach(s=>s.st='skip');k._i=k.steps.length}
 renderSim();emit((ok?'perm_allowed:':'perm_denied:')+kind);
 if(ok&&kind==='delete')toast('⚠ 在真實環境中，刪除後可能無法復原。沒備份時請拒絕。','warn');
 setTimeout(()=>advance(k),400);
}
function finish(k){
 k.status='done';const v=k.variant,d=k.denied||{};
 const files=k.out.length?{r:'files',f:k.out}:null;
 const T2={
  invoices:`<b>完成了！</b>我整理了 12 張發票，產出：<ul><li>發票彙整_2026Q3.xlsx：日期、廠商、統編、金額</li><li>異常清單.md：2 張缺統編、1 張金額與品項不符</li></ul>${d.rename?'你拒絕了重新命名，所以原檔名維持不變。<br>':'已把檔名統一改為「日期_廠商_金額」。<br>'}建議你<b>先點開 Excel 抽查幾列</b>，再正式使用。`,
  bank:'<b>完成了！</b>共比對 3 個月的交易，找到 <b>3 筆未達帳</b>（匯款在途、手續費、未兌現支票）。請抽查並對照原始單據。',
  dunning:'<b>完成了。</b>目前沒有連接 Gmail，所以我把催款信存成檔案。若想直接在 Gmail 建草稿，請先到「自訂 → 連接器」連接 Gmail。',
  dunning_gmail:'<b>完成了！</b>我在 Gmail 建立了 <b>3 封草稿</b>，<b>都還沒寄出</b>。請逐封檢查金額與語氣，確認後再自行寄出。',
  delete:d.delete?'好的，<b>我沒有刪除任何檔案</b>。已把待刪除清單存成檔案，確認備份後你可以再決定。':'已刪除 47 個檔案。<br><small style="color:var(--warn)">（真實環境中這類操作可能無法復原，下次請先備份。）</small>',
  generic:'<b>完成了！</b>我已讀取資料夾並整理出摘要（教學模擬）。'
 };
 if(v==='delete'&&!d.delete)k.out=[];
 k.msgs.push({r:'c',t:T2[v]||T2.generic,btn:v==='dunning'?[{act:'goto-conn',l:'前往連接器'}]:null});
 if(k.out.length)k.msgs.push({r:'files',f:k.out});
 renderSim();emit('task_done:'+v);
}

const ACT={
 noop(){toast('教學模擬版：此選單不可用')},

/* ========== 動畫影片播放器（時間驅動，與 Remotion 同樣的「畫面 = f(時間)」概念） ========== */
class Player{
 constructor(host,scenes,key){
  Object.assign(this,{h:host,sc:scenes,key,t:0,playing:false,idx:-1,speed:1,cap:true,tts:false,done:false,started:false,raf:0,last:0});
  this.total=scenes.reduce((a,s)=>a+s.dur,0);this.starts=[];let c=0;scenes.forEach(s=>{this.starts.push(c);c+=s.dur});
  host.innerHTML=`<div class="vwrap"><div class="vstage"><div class="vscene"></div><div class="vdots"></div><div class="vcap"><span></span></div><button class="vplay" data-v="play" aria-label="播放動畫">▶ <span>播放動畫</span></button></div>
  <div class="vctl"><button class="pp" data-v="toggle" aria-label="播放或暫停">▶</button><input class="vseek" type="range" min="0" max="1000" value="0" aria-label="影片進度"><span class="vtime">0:00 / ${fmt(this.total)}</span><button data-v="speed" aria-label="播放速度">1x</button><button data-v="cap" class="on">字幕</button><button data-v="tts" title="用瀏覽器朗讀字幕">旁白</button><button data-v="full">全螢幕</button></div></div>`;
  this.wrap=$('.vwrap',host);this.stage=$('.vstage',host);this.scene=$('.vscene',host);this.capEl=$('.vcap',host);this.capSpan=$('.vcap span',host);this.tagEl=$('.vdots',host);
  this.seek=$('.vseek',host);this.timeEl=$('.vtime',host);this.pp=$('.pp',host);this.playBtn=$('.vplay',host);
  host.addEventListener('click',e=>{const b=e.target.closest('[data-v]');if(!b)return;const a=b.dataset.v;
   if(a==='play'||a==='toggle'){this.playing?this.pause():this.play()}
   else if(a==='speed'){this.speed=this.speed===1?1.5:this.speed===1.5?2:1;b.textContent=this.speed+'x'}
   else if(a==='cap'){this.cap=!this.cap;b.classList.toggle('on',this.cap);this.capEl.classList.toggle('off',!this.cap)}
   else if(a==='tts'){this.tts=!this.tts;b.classList.toggle('on',this.tts);if(!this.tts)this.say('');else this.say(this.sc[Math.max(0,this.idx)].cap)}
   else if(a==='full'){try{(document.fullscreenElement?document.exitFullscreen():this.wrap.requestFullscreen()).catch(()=>{})}catch(err){}}});
  this.seek.addEventListener('input',()=>{this.started=true;this.playBtn.classList.add('hide');this.t=this.seek.value/1000*this.total;this.draw(this.t);this.checkDone()});
  this.ro=new ResizeObserver(()=>{this.stage.style.fontSize=Math.max(6,this.stage.clientWidth/58)+'px'});this.ro.observe(this.stage);
  this.stage.style.fontSize=Math.max(6,this.stage.clientWidth/58)+'px';
  this.draw(3.8);this.timeEl.textContent='0:00 / '+fmt(this.total);
 }
 say(txt){try{if(!('speechSynthesis' in window))return;speechSynthesis.cancel();if(!txt||!this.tts)return;const u=new SpeechSynthesisUtterance(txt);u.lang='zh-TW';u.rate=1.05;speechSynthesis.speak(u)}catch(e){}}
 play(){
  if(this.t>=this.total-0.05)this.t=0;
  if(!this.started){this.started=true;this.t=0;this.idx=-1}
  this.playing=true;this.playBtn.classList.add('hide');this.pp.textContent='❚❚';this.last=performance.now();
  this.say(this.sc[Math.max(0,this.idx)>=0?Math.max(0,this.idx):0].cap);
  cancelAnimationFrame(this.raf);this.raf=requestAnimationFrame(ts=>this.tick(ts));
 }
 pause(){this.playing=false;this.pp.textContent='▶';cancelAnimationFrame(this.raf);this.say('')}
 tick(ts){
  if(!this.playing)return;
  const dt=Math.min(0.1,(ts-this.last)/1000);this.last=ts;this.t=Math.min(this.total,this.t+dt*this.speed);
  this.draw(this.t);
  if(this.t>=this.total){this.pause();this.playBtn.querySelector('span').textContent='再看一次';this.playBtn.classList.remove('hide');this.checkDone();return}
  this.raf=requestAnimationFrame(x=>this.tick(x));
 }
 checkDone(){if(!this.done&&this.t>=this.total-0.4){this.done=true;emit('video_done:'+this.key)}}
 draw(t){
  let i=0;for(let k=0;k<this.sc.length;k++)if(t>=this.starts[k])i=k;
  const local=t-this.starts[i];
  if(i!==this.idx){this.scene.innerHTML=this.sc[i].html;this.capSpan.textContent=this.sc[i].cap;this.tagEl.innerHTML=this.sc.map((_,k)=>`<i class="${k===i?'on':''}"></i>`).join('');this.tagEl.title=this.sc[i].tag||'';
   if(this.playing&&this.idx!==-1)this.say(this.sc[i].cap);this.idx=i}
  $$('[data-at]',this.scene).forEach(e=>e.classList.toggle('in',local>=+e.dataset.at));
  $$('[data-win]',this.scene).forEach(e=>{const [a,b]=e.dataset.win.split(',').map(Number);e.classList.toggle('on',local>=a&&local<b)});
  $$('[data-prog]',this.scene).forEach(e=>{const [a,d]=e.dataset.prog.split(',').map(Number);const p=clamp((local-a)/d);e.style.setProperty('--p',p);
   if(e.dataset.type!==undefined){const f=e.dataset.type;e.textContent=f.slice(0,Math.ceil(f.length*p))+(p>0&&p<1?'▍':'')}});
  this.seek.value=Math.round(t/this.total*1000);this.timeEl.textContent=fmt(t)+' / '+fmt(this.total);
 }
 destroy(){this.pause();try{this.ro.disconnect()}catch(e){}}
}

/* ========== 課程控制 ========== */
const STORE_KEY='cowork-course-v1';
const POINTS={step:10,quiz1:5,quiz2:2};
const hintOpen={};const wrong={};

const mwrong={};
function matchHtml(key){
 const g=MATCH[key];
 return g.items.map((it,i)=>{const ok=has('match_ok:'+it.id),bad=mwrong[it.id]||[];
  return `<div class="mq ${ok?'ok':''}"><p><span class="mn2">${i+1}</span>${it.q}</p><div class="mopts">${g.opts.map(o=>`<button class="opt ${ok&&o===it.a?'good':''} ${bad.includes(o)?'bad':''}" data-act="match" data-g="${key}" data-i="${it.id}" data-o="${esc(o)}" ${ok?'disabled':''}>${o}</button>`).join('')}</div>${ok?`<div class="why">✓ ${it.why}</div>`:bad.length?'<div class="why" style="color:var(--warn);background:var(--warn-soft)">再想想，換一個試試。</div>':''}</div>`}).join('');
}
const LESSONS=['看動畫','懂重點','動手做','小測驗'];
const LMETA=[['▶ 動畫',''],['▣ 重點卡','y'],['✎ 練習',''],['? 測驗','b']];
const LMIN=[1,1,3,2];
const Course={
 cur:0,slide:0,player:null,
 P:Object.assign({steps:{},quiz:{},name:'',cel:{},seen:{}},store.get(STORE_KEY,{})),
 teacher:store.get('cowork-teacher',false),
 save(){store.set(STORE_KEY,this.P)},
 stepsDone(u){return u.steps.every(s=>this.P.steps[s.id])},
 quizDone(u){return u.quiz.every((_,q)=>this.P.quiz[u.id+'-'+q])},
 unitDone(i){const u=UNITS[i];return this.stepsDone(u)&&this.quizDone(u)},
 unlocked(i){return this.teacher||i===0||this.unitDone(i-1)},
 slideDone(i,s){const u=UNITS[i];if(s===0)return !!this.P.steps[u.steps[0].id];if(s===1)return !!this.P.seen[u.id+'-1'];if(s===2)return this.stepsDone(u);return this.quizDone(u)},
 score(){let s=0;UNITS.forEach(u=>{u.steps.forEach(x=>{if(this.P.steps[x.id])s+=POINTS.step});u.quiz.forEach((_,q)=>{s+=this.P.quiz[u.id+'-'+q]||0})});return s},
 max(){return UNITS.reduce((a,u)=>a+u.steps.length*POINTS.step+u.quiz.length*POINTS.quiz1,0)},
 evaluate(){
  const u=UNITS[this.cur];let ch=false;
  u.steps.forEach(s=>{if(!this.P.steps[s.id]&&s.check()){this.P.steps[s.id]=1;ch=true;toast('+10 分  ✓ '+s.text,'ok')}});
  if(ch){this.save();this.renderSteps();this.renderTop();this.afterProgress()}
 },
 afterProgress(){
  const i=this.cur;this.renderNav();this.renderFoot();
  if(this.unitDone(i)&&!this.P.cel[i]){this.P.cel[i]=1;this.save();confetti();toast(i===UNITS.length-1?'全部單元完成！到最後一課領結業證書':'單元完成！可以前往下一單元','ok')}
 },
 go(i,force,slide){
  if(!force&&!this.unlocked(i)){toast('請先完成上一個單元的練習與小測驗','warn');return}
  this.cur=i;this.slide=slide||0;this.renderUnit();this.evaluate();
 },
 step(d){
  let s=this.slide+d,u=this.cur;
  if(s<0){if(u===0)return;u--;s=3}
  else if(s>3){
   if(u===UNITS.length-1){toast('這是最後一課了，辛苦了！','ok');return}
   if(!this.unitDone(u)&&!this.teacher){toast('先完成這個單元的練習與小測驗，才能進入下一單元','warn');return}
   u++;s=0;
  }
  this.go(u,true,s);
 },
 renderTop(){
  const sc=this.score(),mx=this.max(),u=UNITS[this.cur];
  $('#pbar').style.width=Math.round(sc/mx*100)+'%';
  $('#score').innerHTML=`積分 <b>${sc}</b> / ${mx}`;
  const t=$('#teacher');t.classList.toggle('on',this.teacher);t.setAttribute('aria-pressed',this.teacher);
  $('#rd-sub').textContent=`階段 ${this.cur+1}：${u.short}`;
  $('#rd-count').textContent=`${this.cur*4+this.slide+1} / ${UNITS.length*4}`;
  const pv=$('[data-act="prev"]'),nx=$('[data-act="next"]');
  if(pv)pv.disabled=this.cur===0&&this.slide===0;
  if(nx)nx.disabled=this.cur===UNITS.length-1&&this.slide===3;
 },
 renderNav(){
  $('#segs').innerHTML=UNITS.map((u,i)=>`<div class="sgrp">${[0,1,2,3].map(s=>`<button class="seg ${this.slideDone(i,s)?'done':''} ${i===this.cur&&s===this.slide?'cur':''} ${this.unlocked(i)?'':'lock'}" data-act="seg" data-u="${i}" data-s="${s}" aria-label="單元${i+1} 第${s+1}課 ${LESSONS[s]}" title="單元${i+1}・${LESSONS[s]}"></button>`).join('')}</div>`).join('');
 },
 renderUnit(){
  const u=UNITS[this.cur],n=this.cur+1,s=this.slide;
  if(this.player){this.player.destroy();this.player=null}
  let h=`<div class="rd-tag"><span class="chip2">單元 ${n} · 第 ${s+1} 課</span></div><h2 class="rd-h">${u.short}｜${LESSONS[s]}</h2>
  <div class="rd-meta"><span class="chip2 ${LMETA[s][1]}">${LMETA[s][0]}</span><span>約 ${LMIN[s]} 分鐘</span><button class="mini" data-act="open-map" data-m="${UNITMAP[u.id]}">對照心智圖</button></div>
  <div class="tip">${pix('bulb','#8A5A00',20)}<span>${u.tips[s]}</span></div>`;
  if(s===0)h+=`<p class="goal"><b>${u.title}</b><br>${u.goal}</p><div id="player"></div>`;
  if(s===1){h+=`<div class="cards">${u.cards.map(c=>`<div class="kcard" data-act="flip" role="button" tabindex="0" aria-label="${c.f}，點一下翻面"><div><span class="f"><b>${c.f}</b><small>${c.s}</small></span><span class="b">${c.b}</span></div></div>`).join('')}</div>`;this.P.seen[u.id+'-1']=1;this.save()}
  if(s===2){
   if(u.sample)h+=`<div class="sample"><b>${u.sample.t}</b>${u.sample.rows.map(esc).join('<br>')}</div>`;
   (u.prompts||[]).forEach((p,i)=>{h+=`<div class="pcard ${p.danger?'dg':''}"><div class="ph">${pix('chat','#2B2A27',16)}<span class="grow">${p.t}</span></div><div class="pb">${esc(p.text)}</div><div class="pa"><button class="mini" data-act="copy" data-i="${i}">複製</button><button class="mini solid" data-act="send-prompt" data-i="${i}">送到模擬器輸入框 →</button></div></div>`});
   if(u.match)h+=`<h3 class="rd-sec">配對小遊戲 <em>選出最適合的名詞</em></h3><div id="match">${matchHtml(u.match)}</div>`;
   h+=`<h3 class="rd-sec">實作練習 <em>在右邊模擬器操作，會自動打勾</em></h3><ul class="steps" id="steps"></ul>${u.builder?builderHtml():''}`;
  }
  if(s===3)h+=`<div class="quiz" id="quiz"></div><div id="foot"></div>`;
  $('#unit').innerHTML=h;$('#unit').scrollTop=0;
  if(s===0)this.player=new Player($('#player'),VIDEOS[u.id],u.id);
  this.renderSteps();this.renderQuiz();this.renderFoot();this.renderNav();this.renderTop();
  if(s===2&&u.builder)buildPrompt();
 },
 renderSteps(){
  const el=$('#steps');if(!el)return;const u=UNITS[this.cur];
  el.innerHTML=u.steps.map((s,i)=>{const ok=this.P.steps[s.id];
   return `<li class="step ${ok?'ok':''}"><div class="row"><span class="chk">${ok?IC.check:''}</span><span class="tx">${i+1}. ${s.text}</span><span class="acts">${ok?'':`<button class="mini" data-act="hint" data-id="${s.id}">提示</button>`}${this.teacher&&!ok?`<button class="mini" data-act="force" data-id="${s.id}">略過</button>`:''}</span></div>${hintOpen[s.id]&&!ok?`<div class="hint">💡 ${s.hint}${s.sel==='.vplay'?'（這步在第 1 課）':'（模擬器中對應的位置已閃爍標示）'}</div>`:''}</li>`}).join('');
 },
 renderQuiz(){
  const el=$('#quiz');if(!el)return;const u=UNITS[this.cur];
  el.innerHTML=u.quiz.map((q,qi)=>{const key=u.id+'-'+qi,got=this.P.quiz[key],bad=wrong[key]||[];
   return `<div class="q ${got?'ok':''}"><p>Q${qi+1}. ${q.q}</p><div class="opts">${q.o.map((o,oi)=>`<button class="opt ${got&&oi===q.a?'good':''} ${bad.includes(oi)?'bad':''} ${this.teacher&&!got&&oi===q.a?'tip':''}" data-act="ans" data-q="${qi}" data-o="${oi}" ${got?'disabled':''}>${String.fromCharCode(65+oi)}. ${o}</button>`).join('')}</div>${got?`<div class="why">✓ ${q.why}</div>`:bad.length?'<div class="why" style="color:var(--warn);background:var(--warn-soft)">再想想，換一個選項試試。</div>':''}</div>`}).join('');
 },
 renderFoot(){
  const el=$('#foot');if(!el)return;
  const i=this.cur,last=i===UNITS.length-1;let h='';
  if(!this.unitDone(i))h=`<p class="goal" style="margin-top:14px">完成本單元全部練習與測驗後，按右下角 › 進入下一單元。</p>`;
  if(last&&UNITS.every((_,k)=>this.unitDone(k))){
   const sc=this.score(),mx=this.max(),pct=sc/mx,rank=pct>=.9?'Cowork 達人':pct>=.7?'合格的 AI 同事':'見習生';
   h+=`<div class="cert"><h3>結業！你的成績</h3><div class="big">${sc} / ${mx}</div><p>稱號：<b>${rank}</b></p><input class="fld" id="cert-name" placeholder="輸入姓名" value="${esc(this.P.name||'')}" aria-label="姓名"><br><button class="btn" data-act="cert">下載結業證書 PNG</button></div>`;
  }else if(this.unitDone(i)&&!last)h=`<p class="goal" style="margin-top:14px">✓ 本單元完成！按右下角 › 前往單元 ${i+2}。</p>`;
  el.innerHTML=h;
 }
};

function builderHtml(){
 return `<div class="builder"><b>指令組裝器</b><label>1) 目標<select id="pb-goal"><option value="把每張發票的日期、廠商、統編、金額整理成 Excel">整理發票成 Excel</option><option value="核對銀行對帳單與帳上明細，列出未達帳項目">銀行對帳</option></select></label>
 <fieldset><legend>2) 限制（可複選）</legend><label><input type="checkbox" class="pb-l" value="不要修改原始檔案" checked>不要修改原始檔案</label><label><input type="checkbox" class="pb-l" value="缺統編的標紅" checked>缺統編的標紅</label><label><input type="checkbox" class="pb-l" value="重大動作先問我">重大動作先問我</label></fieldset>
 <label>3) 預覽（資料來源＝你授權的資料夾；格式＝Excel）<textarea id="pb-out" rows="4" readonly></textarea></label><button class="btn" id="pb-send" data-act="pb-send">送到 Cowork 輸入框 →</button></div>`;
}
function buildPrompt(){
 const g=$('#pb-goal');if(!g)return '';
 const ls=$$('.pb-l:checked').map(x=>x.value);
 const t=`請讀取我授權的資料夾，${g.value}。輸出：Excel 檔（一列一筆，含欄位標題）。${ls.length?'限制：'+ls.join('；')+'。':''}`;

function drawCert(){
 const c=document.createElement('canvas');c.width=1600;c.height=1131;const g=c.getContext('2d');
 g.fillStyle='#FBF8F2';g.fillRect(0,0,1600,1131);
 g.strokeStyle='#C96442';g.lineWidth=10;g.strokeRect(50,50,1500,1031);g.lineWidth=2;g.strokeRect(75,75,1450,981);
 g.textAlign='center';g.fillStyle='#2B2A27';
 const serif='"Noto Serif TC","Songti TC","PMingLiU",serif';
 g.font=`700 84px ${serif}`;g.fillText('結業證書',800,260);
 g.font=`36px ${serif}`;g.fillStyle='#6F6A5F';g.fillText('Claude Cowork 基礎入門班',800,330);
 const name=(Course.P.name||'').trim()||'學員';
 g.fillStyle='#A94E31';g.font=`700 110px ${serif}`;g.fillText(name,800,560);
 g.fillStyle='#2B2A27';g.font=`38px ${serif}`;g.fillText('完成全部 6 個單元的互動練習與小測驗',800,660);
 const sc=Course.score(),mx=Course.max(),pct=sc/mx;
 g.fillText(`積分 ${sc} / ${mx}　稱號：${pct>=.9?'Cowork 達人':pct>=.7?'合格的 AI 同事':'見習生'}`,800,730);
 g.fillStyle='#6F6A5F';g.font=`30px ${serif}`;g.fillText(new Date().toLocaleDateString('zh-TW'),800,900);
 const a=document.createElement('a');a.download='Cowork結業證書_'+name+'.png';a.href=c.toDataURL('image/png');document.body.appendChild(a);a.click();a.remove();
}
function confetti(){
 if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
 const cv=document.createElement('canvas');cv.id='confetti';cv.width=innerWidth;cv.height=innerHeight;document.body.appendChild(cv);
 const g=cv.getContext('2d'),cols=['#C96442','#3E7C59','#3B6EA5','#D9A441','#2B2A27'];
 const ps=Array.from({length:90},()=>({x:innerWidth/2,y:innerHeight*.35,vx:(Math.random()-.5)*14,vy:-Math.random()*13-3,r:Math.random()*6+3,c:cols[Math.random()*5|0],a:Math.random()*6}));
 let f=0;(function loop(){g.clearRect(0,0,cv.width,cv.height);ps.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.a+=.2;g.save();g.translate(p.x,p.y);g.rotate(p.a);g.fillStyle=p.c;g.fillRect(-p.r,-p.r/2,p.r*2,p.r);g.restore()});
  if(++f<110)requestAnimationFrame(loop);else cv.remove()})();
}

function mmRender(anchorId,opts){
 opts=opts||{};
 const {cv,svg}=mmq();if(!cv)return;
 const m=MAPS[MM.map],vis=[];
 (function walk(n){vis.push(n);if(n.open&&n.kids)n.kids.forEach(walk)})(m.root);
 const keep=new Set(vis.map(n=>n.id)),born=new Set();
 Object.keys(MM.els).forEach(id=>{if(!keep.has(id)){MM.els[id].remove();delete MM.els[id]}});
 vis.forEach(n=>{
  let e=MM.els[n.id];
  if(!e){e=document.createElement('div');e.dataset.id=n.id;e.dataset.act='mm-node';e.style.setProperty('--c',n.col);e.innerHTML=nodeHtml(n);cv.appendChild(e);MM.els[n.id]=e;if(!opts.noBorn){e.classList.add('born');born.add(n.id)}}
  const has=n.kids&&n.kids.length;
  e.className='mn'+(has?' has':'')+(n.open&&has?' open':'')+(born.has(n.id)?' born':'')+(n.flash?' flash':'');
  if(has){e.setAttribute('role','button');e.tabIndex=0;e.setAttribute('aria-expanded',!!n.open)}else{e.removeAttribute('role');e.removeAttribute('tabindex')}
  e.style.width=MM.W+'px';
 });
 vis.forEach(n=>{n.h=MM.els[n.id].offsetHeight});
 const anchor=anchorId&&NODES[anchorId],ox=anchor?anchor.x:0,oy=anchor?anchor.y:0;
 let cursor=0;
 const shift=(n,d)=>{n.y+=d;if(n.open&&n.kids)n.kids.forEach(k=>shift(k,d))};
 (function place(n){
  n.x=n.depth*(MM.W+MM.GX);
  if(!(n.open&&n.kids&&n.kids.length)){n.y=cursor;cursor+=n.h+MM.GY;return}
  const start=cursor;n.kids.forEach(place);
  const a=n.kids[0],b=n.kids[n.kids.length-1];
  n.y=((a.y+a.h)+(b.y+b.h))/2-n.h;
  if(n.y<start){const d=start-n.y;n.kids.forEach(k=>shift(k,d));n.y=start;cursor+=d}
  cursor=Math.max(cursor,n.y+n.h+MM.GY);
 })(m.root);
 let maxX=0,maxY=0;
 vis.forEach(n=>{const e=MM.els[n.id];e.style.left=n.x+'px';e.style.top=n.y+'px';maxX=Math.max(maxX,n.x+MM.W+14);maxY=Math.max(maxY,n.y+n.h+14)});
 MM.bw=maxX;MM.bh=maxY;
 let p='';
 vis.forEach(n=>{
  const by=n.y+n.h;
  p+=`<path d="M${n.x} ${by}H${n.x+MM.W}" stroke="${n.col}" ${born.has(n.id)?'class="draw"':''} pathLength="1"/>`;
  if(n.open&&n.kids)n.kids.forEach(k=>{
   const x1=n.x+MM.W,y1=n.y+n.h,x2=k.x,y2=k.y+k.h,xm=(x1+x2)/2;
   p+=`<path d="M${x1} ${y1}C${xm} ${y1} ${xm} ${y2} ${x2} ${y2}" stroke="${k.col}" ${born.has(k.id)?'class="draw"':''} pathLength="1"/>`;
  });
 });
 svg.setAttribute('width',maxX);svg.setAttribute('height',maxY);svg.innerHTML=p;
 if(anchor&&anchor.x!==undefined){MM.tx+=(ox-anchor.x)*MM.scale;MM.ty+=(oy-anchor.y)*MM.scale}
 mmApply();
}
function mmApply(){const {cv}=mmq();if(cv)cv.style.transform=`translate(${MM.tx}px,${MM.ty}px) scale(${MM.scale})`}
function mmFit(initial){
 const {vp}=mmq();if(!vp)return;
 const vw=vp.clientWidth,vh=vp.clientHeight;if(!vw||!vh)return;
 let s;
 if(initial){
  s=clamp((vw-24)/MM.bw,0.5,1);
  const root=MAPS[MM.map].root,rb=root.y+root.h;
  MM.scale=s;MM.tx=vw>MM.bw*s?Math.max(12,(vw-MM.bw*s)/2):12;
  MM.ty=MM.bh*s<=vh?(vh-MM.bh*s)/2:clamp(vh/2-rb*s,vh-MM.bh*s-14,14);
 }else{
  s=clamp(Math.min(vw/MM.bw,vh/MM.bh),0.25,1.2);
  MM.scale=s;MM.tx=Math.max(8,(vw-MM.bw*s)/2);MM.ty=MM.bh*s<vh?(vh-MM.bh*s)/2:14;
 }
 mmApply();
}
function mmZoom(f,cx,cy){
 const {vp}=mmq();const r=vp.getBoundingClientRect();
 cx=cx===undefined?r.width/2:cx;cy=cy===undefined?r.height/2:cy;
 const ns=clamp(MM.scale*f,0.25,1.8);
 MM.tx=cx-(cx-MM.tx)*ns/MM.scale;MM.ty=cy-(cy-MM.ty)*ns/MM.scale;MM.scale=ns;mmApply();
}
function mmSetAll(open){
 (function w(n){if(n.kids&&n.kids.length){n.open=n.depth===0?true:open;n.kids.forEach(w)}})(MAPS[MM.map].root);
 mmRender(null,{noBorn:false});mmFit(true);
}
function mmShow(i){
 if(i!==undefined)MM.map=i;
 const {cv}=mmq();if(!cv)return;
 $$('.mtab').forEach((b,k)=>b.classList.toggle('on',k===MM.map));
 Object.keys(MM.els).forEach(id=>MM.els[id].remove());MM.els={};
 mmRender(null,{noBorn:true});mmFit(true);
 store.set('cowork-map',MM.map);
}
function mmToggle(id){
 const n=NODES[id];if(!n||!n.kids||!n.kids.length)return;
 n.open=!n.open;
 if(!n.open)(function c(x){(x.kids||[]).forEach(k=>{k.open=false;c(k)})})(n);

}

 mmShow(n.map);
 const {vp}=mmq();
 MM.scale=Math.max(MM.scale,.8);MM.tx=vp.clientWidth/2-(n.x+MM.W/2)*MM.scale;MM.ty=vp.clientHeight/2-(n.y+n.h/2)*MM.scale;mmApply();

}
function mmInitEvents(){
 const {vp}=mmq();
 let last=null,pd=0,pm=null;
 vp.addEventListener('pointerdown',e=>{MM.ptr.set(e.pointerId,{x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY,drag:false});if(MM.ptr.size===2){const [a,b]=[...MM.ptr.values()];pd=Math.hypot(a.x-b.x,a.y-b.y);pm=MM.scale}});
 vp.addEventListener('pointermove',e=>{
  const p=MM.ptr.get(e.pointerId);if(!p)return;
  if(MM.ptr.size===2){
   p.x=e.clientX;p.y=e.clientY;const [a,b]=[...MM.ptr.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);
   if(pd){const r=vp.getBoundingClientRect();const target=clamp(pm*d/pd,0.25,1.8);mmZoom(target/MM.scale,(a.x+b.x)/2-r.left,(a.y+b.y)/2-r.top)}
   MM.justDragged=true;return;
  }
  const dx=e.clientX-p.x,dy=e.clientY-p.y;
  if(!p.drag&&Math.hypot(e.clientX-p.sx,e.clientY-p.sy)>6){p.drag=true;try{vp.setPointerCapture(e.pointerId)}catch(err){}vp.classList.add('grab')}
  if(p.drag){MM.tx+=dx;MM.ty+=dy;mmApply();MM.justDragged=true}
  p.x=e.clientX;p.y=e.clientY;
 });
 const up=e=>{MM.ptr.delete(e.pointerId);if(MM.ptr.size<2)pd=0;vp.classList.remove('grab');setTimeout(()=>{if(!MM.ptr.size)MM.justDragged=false},0)};
 vp.addEventListener('pointerup',up);vp.addEventListener('pointercancel',up);
 vp.addEventListener('wheel',e=>{e.preventDefault();const r=vp.getBoundingClientRect();
  if(e.ctrlKey||e.metaKey)mmZoom(Math.exp(-e.deltaY*0.01),e.clientX-r.left,e.clientY-r.top);
  else{MM.tx-=e.deltaX;MM.ty-=e.deltaY;mmApply()}},{passive:false});

 new ResizeObserver(()=>{if(document.body.dataset.view==='map'&&!MM.inited.fit){MM.inited.fit=1}}).observe(vp);
}

  <div class="sh-h">${pix(n.ic,n.col==='#7D776B'?'#3E7C59':n.col,34)}<h3>${n.t}</h3></div>
  <p class="sh-d">${n.d||''}</p>${n.box?`<div class="sh-box"><b>白話：</b>${n.box}</div>`:''}${n.red?`<div class="sh-red">${pix('warn','#B4382B',18)}<span>${n.red}</span></div>`:''}${n.more?`<p class="sh-m">${n.more}</p>`:''}${kids?`<ul class="sh-k">${kids}</ul>`:''}
  <div class="sh-b">${n.go?`<button class="btn" data-act="go-unit" data-u="${n.go.u}">▶ 到模擬器練習（單元 ${UNITS.findIndex(x=>x.id===n.go.u)+1}）</button>`:''}${n.map!==undefined?`<button class="btn ghost" data-act="to-map" data-id="${id}">在心智圖中看</button>`:''}</div></div>`;
 $('#sheet').hidden=false;$('#sheet .x').focus();
}
const closeSheet=()=>{$('#sheet').hidden=true};

/* ========== 檢視切換 ========== */
const VIEWS=['map','layers','overview','gloss','learn'];
function setView(v,skipMap){
 if(!VIEWS.includes(v))v='map';
 document.body.dataset.view=v;
 $$('.vsw button').forEach(b=>{const on=b.dataset.v===v;b.classList.toggle('on',on);b.setAttribute('aria-pressed',on)});
 closeSheet();
 if(v==='map'){if(!$('#mmv').dataset.ready){$('#mmv').dataset.ready=1;mmInitEvents()}if(!skipMap)requestAnimationFrame(()=>mmShow())}
 if(v==='layers')renderLayers();
 if(v==='overview')renderOverview();
 if(v==='gloss')renderGloss();
 store.set('cowork-view',v);
}
function gotoUnit(u){
 setView('learn');
 if(typeof Course!=='undefined'){
  const ix=Math.max(0,UNITS.findIndex(x=>x.id===u));const lk=!Course.unlocked(ix);Course.go(ix,true,2);
  if(lk)toast('這個單元通常排在前面單元之後；已先帶你過來看，積分照算','ok');
 }
}
Object.assign(GA,{
 view(el){setView(el.dataset.v)},
 'mm-tab'(el){mmShow(+el.dataset.i)},
 'mm-node'(el,e){if(MM.justDragged)return;mmToggle(el.dataset.id)},
 'mm-all'(){mmSetAll(true)},
 'mm-none'(){mmSetAll(false)},
 'mm-fit'(){mmFit(false)},
 'mm-zoom'(el){mmZoom(+el.dataset.f)},
 'go-unit'(el){closeSheet();gotoUnit(+el.dataset.u)},
 bk(el){openSheet(el.dataset.ref)},
 'sheet-close'(){closeSheet()},
 'sheet-bg'(el,e){if(e.target===el)closeSheet()},
 'to-map'(el){closeSheet();focusNode(el.dataset.id)},
 'open-map'(el){setView('map');mmShow(+el.dataset.m)},
 'ly-tab'(el){const i=+el.dataset.i;if(i>=0&&i<LAYERS.length){LY.cur=i;renderLayers();window.scrollTo(0,0)}}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
let _lw=innerWidth;window.addEventListener('resize',()=>{if(innerWidth!==_lw){_lw=innerWidth;if(document.body.dataset.view==='map')mmFit(true)}});
const UNITMAP={1:0,7:3,2:0,3:2,4:1,5:3,6:2};
window.addEventListener('DOMContentLoaded',()=>{
 $('#mmtabs').innerHTML=MAPS.map((m,i)=>`<button class="mtab" data-act="mm-tab" data-i="${i}">${m.tab}</button>`).join('');
 const sv=new URLSearchParams(location.search).get('view')||store.get('cowork-view','map');
 MM.map=clamp(+store.get('cowork-map',0)||0,0,MAPS.length-1);
 setView(VIEWS.includes(sv)?sv:'map');
});

/* ---- 搜尋與畫面 ---- */
const GL={q:'',cat:'全部'};
const gHay=g=>(g.t+' '+g.s+' '+g.d+' '+g.e+' '+(g.k||'')+' '+g.cat).toLowerCase();
const gMark=(txt,q)=>{if(!q)return esc(txt);const i=txt.toLowerCase().indexOf(q);if(i<0)return esc(txt);return esc(txt.slice(0,i))+'<mark>'+esc(txt.slice(i,i+q.length))+'</mark>'+esc(txt.slice(i+q.length))};
function glossCards(){
 const q=GL.q.trim().toLowerCase();
 const list=GLOSS.filter(g=>(GL.cat==='全部'||g.cat===GL.cat)&&(!q||gHay(g).includes(q)));
 if(!list.length)return `<div class="empty" style="grid-column:1/-1">找不到「${esc(GL.q)}」。試試：連接器、排程、省錢、刪除、專案、Gmail。</div>`;
 return list.map(g=>`<article class="gcard" data-id="${g.id}"><div class="ga" data-act="replay" role="img" aria-label="${esc(g.t)} 的小動畫（點一下重播）" title="點一下重播">${g.anim()}</div><div class="gbody"><div class="gh"><b>${gMark(g.t,q)}</b><span class="gs">${gMark(g.s,q)}</span></div><p>${gMark(g.d,q)}</p><em>${gMark(g.e,q)}</em><div class="gbtn">${g.go?`<button class="mini" data-act="go-unit" data-u="${g.go}">▶ 去練習</button>`:''}${g.map&&NODES[g.map]?`<button class="mini" data-act="to-map" data-id="${g.map}">在心智圖看</button>`:''}</div></div></article>`).join('');
}
function renderGloss(){
 const el=$('#view-gloss');
 el.innerHTML=`<div class="vwrap2 wide"><h2 class="lyh serif">名詞辭典</h2><p class="lys">${GLOSS.length} 個常聽到的詞，每個一句話＋一個小動畫。可以直接搜尋。</p>
 <div class="gsearch"><input id="gl-q" type="search" placeholder="搜尋：例如 連接器、排程、省錢、Gmail、刪除…（按 / 快速搜尋）" value="${esc(GL.q)}" aria-label="搜尋名詞" autocomplete="off"><span class="gcount" id="gl-n"></span></div>
 <div class="gcats" role="group" aria-label="分類">${GCATS.map(c=>`<button class="${c===GL.cat?'on':''}" data-act="gl-cat" data-c="${c}">${c}</button>`).join('')}</div>
 <div class="ggrid" id="gl-grid">${glossCards()}</div>
 <p class="gnote">內容依官方說明整理（查證日：2026-10-04），功能名稱與位置會隨版本更新，請以你實際的 Cowork 畫面為準。官方說明：<a href="https://support.claude.com/en/articles/13345190-getting-started-with-cowork" target="_blank" rel="noopener">Cowork 入門</a>、<a href="https://support.claude.com/en/articles/13854387" target="_blank" rel="noopener">排程任務</a>、<a href="https://support.claude.com/en/articles/14116274-organize-your-tasks-with-projects-in-cowork" target="_blank" rel="noopener">專案</a>。</p></div>`;
 glossCount();
}
function glossCount(){const n=$('#gl-n');if(n)n.textContent=$$('#gl-grid .gcard').length+' 筆'}
function glossRefresh(){const g=$('#gl-grid');if(g){g.innerHTML=glossCards();glossCount();$$('.gcats button').forEach(b=>b.classList.toggle('on',b.dataset.c===GL.cat))}}
Object.assign(GA,{
 gloss(){setView('gloss')},
 'gl-cat'(el){GL.cat=el.dataset.c;glossRefresh()},
 replay(el){const s=el.querySelector('svg');if(!s)return;const c=s.cloneNode(true);el.replaceChild(c,s)}
});
document.addEventListener('input',e=>{if(e.target.id==='gl-q'){GL.q=e.target.value;glossRefresh()}});
document.addEventListener('keydown',e=>{
 if(e.key==='/'&&document.body.dataset.view==='gloss'&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName)){e.preventDefault();const i=$('#gl-q');if(i)i.focus()}
 if(e.key==='Escape'&&document.activeElement&&document.activeElement.id==='gl-q'){GL.q='';document.activeElement.value='';glossRefresh()}
});

setInterval(()=>{
 if(document.body.dataset.view!=='gloss'||document.hidden||matchMedia('(prefers-reduced-motion:reduce)').matches)return;
 $$('#gl-grid .ga').forEach(a=>{const sv=a.querySelector('svg');if(sv)a.replaceChild(sv.cloneNode(true),sv)});
},5200);
