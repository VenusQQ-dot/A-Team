<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Claude Cowork 基礎入門班</title>
<style>
:root{color-scheme:light;--bg:#F1ECE2;--paper:#FBF8F2;--ink:#2B2A27;--muted:#6F6A5F;--line:#E1D8C8;--accent:#C96442;--accent-d:#A94E31;--accent-soft:#F6E1D6;--green:#3E7C59;--green-soft:#DDEBDF;--blue:#3B6EA5;--blue-soft:#DCE8F4;--warn:#B4382B;--warn-soft:#F8DDD8;--amber:#B7791F;--amber-soft:#F8EBC8;--r:12px;--serif:"Noto Serif TC","Source Han Serif TC","Songti TC","PMingLiU",Georgia,serif;--sans:system-ui,-apple-system,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
h1,h2,h3,h4,p{margin:0}
svg{flex:none}
#app{height:100%;display:flex;flex-direction:column}

/* ===== top bar ===== */
.topbar{height:56px;flex:none;display:flex;align-items:center;gap:16px;padding:0 20px;border-bottom:1px solid var(--line);background:var(--paper)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:32px;height:32px;border-radius:9px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:19px}
.brand b{font-family:var(--serif);font-size:17px;white-space:nowrap}
.brand small{display:block;color:var(--muted);font-size:12px;line-height:1.2}
.pbar{flex:1;max-width:320px;height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.pbar i{display:block;height:100%;width:0;background:var(--accent);transition:width .5s}
.score{font-size:13px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.score b{color:var(--ink);font-size:17px}
.tspacer{flex:1}
.tbtn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 11px;font-size:13px;white-space:nowrap}
.tbtn:hover{border-color:var(--accent)}
.tbtn.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.panes{display:none}

/* ===== layout ===== */
.layout{flex:1;min-height:0;display:grid;grid-template-columns:minmax(390px,37%) 1fr}
.coach{overflow:auto;padding:14px 20px 70px;border-right:1px solid var(--line);scroll-behavior:smooth}
.stage{padding:16px;min-width:0;min-height:0;display:flex;background:radial-gradient(circle at 1px 1px,#d8cfbd 1px,transparent 0) 0 0/18px 18px}

/* ===== coach panel ===== */
.units{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;margin:0 -4px 6px;scrollbar-width:thin}
.upill{flex:none;display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:99px;padding:4px 12px 4px 5px;font-size:13px;white-space:nowrap}
.upill .n{width:22px;height:22px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-size:12px;font-weight:700}
.upill.on{border-color:var(--accent);background:var(--accent-soft)}
.upill.on .n{background:var(--accent);color:#fff}
.upill.done .n{background:var(--green);color:#fff}
.upill.lock{opacity:.5}
.kick{color:var(--accent-d);font-size:13px;font-weight:700;letter-spacing:.06em}
.unit h2{font-family:var(--serif);font-size:26px;line-height:1.3;margin:2px 0 4px}
.goal{color:var(--muted);margin-bottom:12px}
.unit h3{font-size:15px;margin:22px 0 8px;display:flex;align-items:center;gap:8px}
.unit h3 em{font-style:normal;font-size:12px;font-weight:600;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:99px;padding:0 8px}

.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kcard{perspective:700px;height:132px}
.kcard>div{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.kcard.flip>div{transform:rotateY(180deg)}
.kcard span{position:absolute;inset:0;backface-visibility:hidden;border-radius:var(--r);padding:10px 11px;display:flex;flex-direction:column;justify-content:center;border:1px solid var(--line);background:#fff}
.kcard .f b{font-family:var(--serif);font-size:18px;line-height:1.3}
.kcard .f small{color:var(--muted);margin-top:4px}
.kcard .b{transform:rotateY(180deg);background:var(--accent-soft);border-color:#EBC3AF;font-size:13px;line-height:1.5}

.steps{list-style:none;margin:0;padding:0;display:grid;gap:7px}
.step{border:1px solid var(--line);background:#fff;border-radius:var(--r);padding:9px 12px}
.step .row{display:flex;align-items:flex-start;gap:10px}
.chk{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none;margin-top:1px;color:#fff;font-size:14px}
.step.ok{background:var(--green-soft);border-color:#B9D6C0}
.step.ok .chk{background:var(--green);border-color:var(--green)}
.step .tx{flex:1}
.step .acts{display:flex;gap:6px;flex:none}
.mini{font-size:12px;border:1px solid var(--line);background:var(--paper);border-radius:99px;padding:1px 9px}
.mini:hover{border-color:var(--accent);color:var(--accent-d)}
.hint{margin:6px 0 0 32px;font-size:13px;color:var(--accent-d);background:var(--accent-soft);border-radius:8px;padding:5px 9px}

.quiz{display:grid;gap:10px}
.q{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px}
.q.ok{border-color:#B9D6C0}
.q p{font-weight:600;margin-bottom:8px}
.opts{display:grid;gap:6px}
.opt{text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:9px;padding:7px 11px;transition:.15s}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.opt.good{background:var(--green-soft);border-color:var(--green);font-weight:600}
.opt.bad{background:var(--warn-soft);border-color:var(--warn);text-decoration:line-through;color:var(--muted)}
.opt.tip{box-shadow:inset 3px 0 0 var(--green)}
.why{margin-top:8px;font-size:13px;color:var(--green);background:var(--green-soft);border-radius:8px;padding:6px 10px}
.btn{background:var(--accent);color:#fff;border-radius:10px;padding:8px 16px;font-weight:600}
.btn:hover{background:var(--accent-d)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.nextbar{display:flex;justify-content:space-between;gap:10px;margin-top:22px}

.builder{margin-top:10px;background:#fff;border:1px dashed #D4B9A8;border-radius:var(--r);padding:12px;display:grid;gap:8px}
.builder label,.builder legend{font-size:13px;font-weight:600;color:var(--muted)}
.builder select,.builder textarea,.fld{width:100%;border:1px solid var(--line);border-radius:8px;padding:6px 9px;font:inherit;background:var(--paper);color:var(--ink)}
.builder fieldset{border:0;padding:0;margin:0;display:grid;gap:2px}
.builder fieldset label{font-weight:400;color:var(--ink);display:flex;gap:7px;align-items:center}
.cert{margin-top:18px;border:2px solid var(--accent);border-radius:14px;padding:16px;background:linear-gradient(135deg,#FFF8EE,#F9E7DA);text-align:center}
.cert h3{justify-content:center;font-family:var(--serif);font-size:20px;margin:0 0 4px!important}
.cert .big{font-family:var(--serif);font-size:34px;color:var(--accent-d)}
.cert input{max-width:260px;text-align:center;margin:8px 0}

/* ===== video player ===== */
.vwrap{border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#fff;box-shadow:0 4px 18px rgba(60,40,20,.08)}
.vstage{position:relative;aspect-ratio:16/9;background:#FBF6EC;overflow:hidden;font-size:11px;color:var(--ink);user-select:none}
.vstage::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 1px 1px,#E3D8C4 1px,transparent 0) 0 0/1.6em 1.6em;opacity:.8}
.vscene{position:absolute;inset:0}
.vs{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:1.4em;padding:2.4em 3em 4.6em;flex-wrap:wrap}
.vi{opacity:0;transform:translateY(1.2em) scale(.97);transition:opacity .55s ease,transform .55s cubic-bezier(.2,.9,.3,1.2)}
.vi.in{opacity:1;transform:none}
.vs-t,.vs-y,.vs-l{flex-wrap:nowrap}
.vs-t{flex-direction:column;text-align:center;gap:.6em}
.vs-t>*{max-width:100%}
.vk{color:var(--accent-d);font-weight:700;font-size:1.6em;letter-spacing:.12em}
.vh{font-family:var(--serif);font-size:3.1em;line-height:1.3;font-weight:700;max-width:100%}
.vsub{font-size:1.7em;color:var(--muted)}
.vcol{width:15em;background:#fff;border:.15em solid var(--line);border-radius:1em;padding:1.1em 1.1em 1.2em;display:flex;flex-direction:column;gap:.4em;text-align:center;align-items:center}
.vcol b{font-family:var(--serif);font-size:1.9em}
.vcol span{font-size:1.4em;color:var(--muted);line-height:1.4}
.vcol.hot{border-color:var(--accent);background:var(--accent-soft)}
.vcol.hot span{color:var(--ink)}
.vcol.bad{border-color:var(--warn);background:var(--warn-soft)}
.vcol.good{border-color:var(--green);background:var(--green-soft)}
.vcic{font-size:3.6em;color:var(--accent-d);line-height:1}
.vcol.bad .vcic{color:var(--warn)}.vcol.good .vcic{color:var(--green)}
.vbox{width:12.5em;background:#fff;border:.15em solid var(--line);border-radius:1em;padding:1em;display:flex;flex-direction:column;align-items:center;gap:.3em;text-align:center}
.vbox svg{font-size:3.4em;color:var(--accent-d)}
.vbox b{font-size:1.6em;font-family:var(--serif)}
.vbox small{font-size:1.2em;color:var(--muted);line-height:1.35}
.varr{font-size:3em;color:var(--accent)}
.vnote{width:100%;text-align:center;font-size:1.7em;color:var(--accent-d);font-weight:600}
.vs-y{flex-direction:column}
.vcomp{width:44em;max-width:100%;background:#fff;border:.15em solid var(--line);border-radius:1.2em;padding:1.1em 1.3em;box-shadow:0 .5em 1.6em rgba(60,40,20,.1);position:relative}
.vlab{font-size:1.2em;color:var(--muted);margin-bottom:.4em;font-weight:600}
.vtxt{font-size:1.75em;line-height:1.55;min-height:4.7em}
.vbtn{position:absolute;right:1em;bottom:1em;background:var(--accent);color:#fff;border-radius:.7em;padding:.3em 1em;font-size:1.4em;font-weight:700}
.vbtn.in{animation:vb 1s ease-in-out .3s 2}
@keyframes vb{50%{transform:scale(1.12)}}
.vs-l{flex-direction:column;align-items:flex-start;justify-content:center;gap:.7em;padding-left:9em}
.vlt{font-family:var(--serif);font-size:2.8em;font-weight:700;margin-bottom:.1em}
.vli{display:flex;align-items:center;gap:.7em;font-size:1.9em}
.vli i{width:1.4em;height:1.4em;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-size:.8em;font-style:normal}
.vs-d{gap:2em}
.vfiles{display:grid;gap:.45em}
.vf{display:flex;align-items:center;gap:.5em;background:#fff;border:.12em solid var(--line);border-radius:.6em;padding:.3em .8em;font-size:1.35em}
.vf svg{color:var(--muted)}
.vproc{width:12em;text-align:center;display:grid;gap:.5em}
.vproc small{font-size:1.3em;color:var(--muted)}
.vbar{height:.9em;border-radius:9em;background:var(--line);overflow:hidden}
.vbar i{display:block;height:100%;width:calc(var(--p,0)*100%);background:var(--accent)}
.vout{display:flex;flex-direction:column;align-items:center;gap:.2em;background:var(--green-soft);border:.15em solid var(--green);border-radius:1em;padding:1em 1.4em;text-align:center}
.vout svg{font-size:3.6em;color:var(--green)}
.vout b{font-size:1.6em;font-family:var(--serif)}
.vout small{font-size:1.2em;color:var(--muted)}
.vcap{position:absolute;left:0;right:0;bottom:0;padding:.7em 1.4em;background:linear-gradient(transparent,rgba(43,42,39,.82));color:#fff;font-size:1.55em;line-height:1.45;text-align:center;min-height:2.6em;display:flex;align-items:flex-end;justify-content:center}
.vcap.off{display:none}
.vplay{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--accent);color:#fff;border-radius:99px;padding:.6em 1.5em;font-size:1.9em;font-weight:700;box-shadow:0 .4em 1.6em rgba(201,100,66,.5);z-index:2}
.vplay.hide{display:none}
.vctl{display:flex;align-items:center;gap:8px;padding:7px 10px;background:var(--paper);border-top:1px solid var(--line);font-size:13px}
.vctl{flex-wrap:wrap}
.vctl button{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:7px;padding:2px 9px;font-size:12px}
.vctl button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.vctl .pp{width:30px;font-size:13px}
.vseek{flex:1;accent-color:var(--accent);min-width:0}
.vtime{font-variant-numeric:tabular-nums;color:var(--muted);min-width:76px;text-align:right}
.vwrap:fullscreen{display:flex;flex-direction:column;justify-content:center;background:#111}
.vwrap:fullscreen .vstage{aspect-ratio:auto;flex:1}

/* ===== simulator ===== */
.sim{flex:1;display:flex;flex-direction:column;background:#fff;border:1px solid #D5CBB8;border-radius:14px;box-shadow:0 14px 44px rgba(60,40,20,.16);overflow:hidden;min-width:0;min-height:0;position:relative}
.sim-chrome{flex:none;height:46px;display:flex;align-items:center;gap:12px;padding:0 14px;background:#F4EFE6;border-bottom:1px solid var(--line)}
.dots{display:flex;gap:6px}.dots i{width:11px;height:11px;border-radius:50%;background:#DDD3C2}
.modes{margin:0 auto;display:flex;background:#E8E0D0;border-radius:99px;padding:3px}
.modes button{padding:3px 20px;border-radius:99px;font-size:13px;font-weight:600;color:var(--muted)}
.modes button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.sim-badge{font-size:11px;color:var(--amber);background:var(--amber-soft);border-radius:99px;padding:1px 9px;white-space:nowrap}
.sim-body{flex:1;min-height:0;display:grid;grid-template-columns:196px 1fr}
.sb{background:#F7F3EA;border-right:1px solid var(--line);padding:10px;display:flex;flex-direction:column;gap:3px;overflow:auto;min-height:0}
.sb button{display:flex;align-items:center;gap:9px;text-align:left;border-radius:9px;padding:7px 10px;font-size:14px;width:100%}
.sb-new{background:var(--accent-soft);color:var(--accent-d);font-weight:700;margin-bottom:6px}
.sb-new:hover{background:#F0D2C3}
.sb-i:hover,.sb-t:hover{background:#ECE5D6}
.sb-i.on,.sb-t.on{background:#E8E0D0;font-weight:600}
.sb-h{font-size:11px;color:var(--muted);margin:12px 10px 2px;letter-spacing:.06em}
.sb-empty{font-size:12px;color:var(--muted);padding:2px 10px}
.sb-t{font-size:13px!important}
.sb-t span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:#C9BFAE;flex:none}
.dot.running{background:var(--accent);animation:pl2 1.2s infinite}.dot.done{background:var(--green)}.dot.blocked{background:var(--amber)}
@keyframes pl2{50%{opacity:.3}}
.sb-foot{margin-top:auto;font-size:12px;color:var(--muted);padding:8px 10px;border-top:1px solid var(--line)}
.sb-foot b{color:var(--ink);display:block}
.sim-main{min-width:0;min-height:0;overflow:auto;display:flex;flex-direction:column}

.home{margin:auto;width:100%;max-width:640px;padding:22px 24px;display:grid;gap:18px}
.hello{display:flex;align-items:center;justify-content:center;gap:12px;font-family:var(--serif)}
.hello svg{font-size:30px;color:var(--accent)}
.hello h1{font-size:26px;font-weight:600}
.composer{border:1px solid #D8CDB9;border-radius:16px;background:#fff;box-shadow:0 3px 14px rgba(60,40,20,.07);padding:10px 12px}
.composer:focus-within{border-color:var(--accent)}
.composer textarea{width:100%;border:0;resize:none;outline:0;font:inherit;min-height:74px;background:transparent}
.comp-bar{display:flex;align-items:center;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:99px;padding:3px 12px;font-size:13px}
.chip:hover{border-color:var(--accent)}
.chip.pri{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.chip.pri:hover{background:var(--accent-d)}
.chip.ghost{color:var(--muted)}
.chip.fold{background:var(--accent-soft);border-color:#EBC3AF;color:var(--accent-d);font-weight:600}
.grow{flex:1}
.send{width:34px;height:34px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:18px}
.send:hover{background:var(--accent-d)}
.sugg-h{font-size:13px;color:var(--muted)}
.sugg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sg{text-align:left;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;display:grid;gap:3px}
.sg:hover{border-color:var(--accent);background:var(--accent-soft)}
.sg svg{font-size:20px;color:var(--accent-d)}
.sg b{font-size:14px}.sg small{color:var(--muted);line-height:1.4}
.sg.dg svg{color:var(--warn)}

.task{flex:1;min-height:0;display:grid;grid-template-columns:1fr 236px}
.chat{overflow:auto;padding:14px 18px;display:flex;flex-direction:column;gap:12px;min-height:0}
.t-title{font-family:var(--serif);font-size:18px;font-weight:600;border-bottom:1px solid var(--line);padding-bottom:8px}
.m-u{align-self:flex-end;max-width:85%;background:#F0E8D8;border-radius:14px 14px 4px 14px;padding:8px 13px;white-space:pre-wrap}
.m-c{display:flex;gap:10px;max-width:96%}
.m-c .av{width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent-d);display:grid;place-items:center;flex:none;font-size:15px}
.m-c ul{margin:6px 0 6px 18px;padding:0}
.m-btns{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.m-files{display:flex;gap:8px;flex-wrap:wrap;margin-left:36px}
.fchip{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 12px;font-size:13px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.fchip:hover{border-color:var(--green);background:var(--green-soft)}
.fchip svg{color:var(--green);font-size:18px}
.perm{margin-left:36px;border:1.5px solid #E5C9A5;background:#FFF8EC;border-radius:12px;padding:10px 13px;display:grid;gap:3px}
.perm.danger{border-color:#E3A59C;background:#FDF0EE}
.perm.allow{opacity:.75}.perm.deny{opacity:.75}
.perm-h{display:flex;align-items:center;gap:7px;color:var(--amber)}
.perm.danger .perm-h{color:var(--warn)}
.perm small{color:var(--muted)}
.perm-b{display:flex;gap:8px;justify-content:flex-end;margin-top:4px}
.perm-r{font-size:13px;font-weight:600;color:var(--muted)}
.fup{margin-top:auto;border:1px solid #D8CDB9;border-radius:14px;display:flex;gap:8px;padding:6px 8px;align-items:center;position:sticky;bottom:0;background:#fff}
.fup textarea{flex:1;border:0;outline:0;resize:none;font:inherit;height:36px;padding-top:6px}
.rp{border-left:1px solid var(--line);background:#FAF7F0;padding:12px;overflow:auto;display:grid;gap:14px;align-content:start;min-height:0}
.rp h4{font-size:12px;color:var(--muted);letter-spacing:.06em;margin-bottom:6px}
.prog{list-style:none;margin:0;padding:0;display:grid;gap:7px;font-size:13px}
.prog li{display:flex;gap:8px;align-items:flex-start;line-height:1.4;color:var(--muted)}
.prog li i{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line);flex:none;display:grid;place-items:center;font-style:normal;font-size:12px;margin-top:1px}
.prog li.run{color:var(--ink);font-weight:600}.prog li.run i{border-color:var(--accent)}
.prog li.done{color:var(--ink)}.prog li.done i{background:var(--green);border-color:var(--green);color:#fff}
.prog li.skip{text-decoration:line-through}
.spin{width:8px;height:8px;border:2px solid var(--accent);border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.ff{font-size:12.5px;display:grid;gap:3px}
.ff div{display:flex;gap:6px;align-items:center;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:var(--muted)}
.ff div.new{color:var(--green);font-weight:600}
.ff b{color:var(--ink)}
.tag{font-size:11px;border-radius:99px;padding:0 8px;background:var(--line);color:var(--muted)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}.tag.ok{background:var(--green-soft);color:var(--green)}

.cust{padding:20px 24px;display:grid;gap:14px;align-content:start}
.cust h2,.sched h2{font-family:var(--serif);font-size:22px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tabs button{padding:6px 14px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent}
.tabs button.on{color:var(--accent-d);border-color:var(--accent)}
.list{display:grid;gap:8px}
.item{border:1px solid var(--line);border-radius:12px;padding:11px 13px;display:flex;align-items:center;gap:12px;background:#fff}
.item .ic{width:36px;height:36px;border-radius:9px;background:var(--accent-soft);color:var(--accent-d);display:grid;place-items:center;font-size:19px;flex:none}
.item .mid{flex:1;min-width:0}.item small{color:var(--muted);display:block;line-height:1.4}
.item .det{margin-top:6px;font-size:12.5px;background:var(--paper);border-radius:8px;padding:6px 10px}
.sw{width:40px;height:22px;border-radius:99px;background:#D2C8B6;position:relative;transition:.2s;flex:none}
.sw::after{content:"";position:absolute;left:2px;top:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.sw.on{background:var(--green)}.sw.on::after{left:20px}
.sched{padding:20px 24px;display:grid;gap:14px;align-content:start}
.note{font-size:13px;color:var(--amber);background:var(--amber-soft);border-radius:10px;padding:8px 12px}
.empty{border:1px dashed #CFC4AF;border-radius:12px;padding:22px;text-align:center;color:var(--muted)}
.modeNote{margin:auto;max-width:460px;text-align:center;padding:30px;display:grid;gap:10px;justify-items:center}
.modeNote svg{font-size:40px;color:var(--accent)}
.modeNote h2{font-family:var(--serif)}
.bubble{background:#F0E8D8;border-radius:12px;padding:7px 14px;font-size:13px}

/* modal */
.modal-bg{position:absolute;inset:0;background:rgba(43,42,39,.42);display:grid;place-items:center;z-index:20;padding:14px;animation:fi .15s}
@keyframes fi{from{opacity:0}}
.modal{background:#fff;border-radius:16px;width:min(620px,100%);max-height:100%;overflow:auto;padding:18px 20px;position:relative;box-shadow:0 20px 60px rgba(0,0,0,.3);display:grid;gap:10px}
.modal h3{font-family:var(--serif);font-size:19px;padding-right:26px}
.modal .x{position:absolute;right:12px;top:10px;font-size:22px;color:var(--muted);line-height:1}
.modal .foot{display:flex;justify-content:flex-end;gap:8px;margin-top:4px}
.fp{display:grid;grid-template-columns:230px 1fr;gap:12px;min-height:250px}
.fp .l{display:grid;gap:6px;align-content:start}
.frow{text-align:left;border:1px solid var(--line);border-radius:10px;padding:7px 10px;display:flex;gap:9px;align-items:center}
.frow:hover{border-color:var(--accent)}.frow.on{background:var(--accent-soft);border-color:var(--accent)}
.frow small{display:block;color:var(--muted);font-size:11.5px;line-height:1.3}
.frow svg{font-size:20px;color:var(--accent-d)}
.fp .r{border:1px solid var(--line);border-radius:10px;padding:10px;font-size:13px;background:var(--paper);display:flex;flex-direction:column;gap:6px}
.fp .r .fl{display:grid;gap:2px;color:var(--muted);flex:1}
.warnbar{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:5px 9px;font-weight:600;font-size:12.5px}
.xl{border-collapse:collapse;width:100%;font-size:13px}
.xl th{background:#E8F0E8;border:1px solid #CBD8CB;padding:3px 8px;text-align:left}
.xl td{border:1px solid #E4E4E4;padding:3px 8px}
.xl .bad td{background:var(--warn-soft);color:var(--warn);font-weight:600}
.xl .warn td{background:var(--amber-soft);color:var(--amber)}
.xl td.r{text-align:right;font-variant-numeric:tabular-nums}
.md{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:13.5px;white-space:pre-wrap;line-height:1.7}
.mail{border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px;background:#fff;display:grid;gap:2px}
.mail .tag{justify-self:start}
.lbl{display:grid;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
.lbl .fld{font-weight:400;color:var(--ink)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}

#toasts{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);display:grid;gap:8px;z-index:100;pointer-events:none;width:min(520px,92vw)}
.toast{background:var(--ink);color:#fff;border-radius:12px;padding:9px 15px;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:ti .3s;text-align:center}
.toast.ok{background:var(--green)}.toast.warn{background:var(--warn)}
@keyframes ti{from{opacity:0;transform:translateY(12px)}}
.pulse{outline:3px solid var(--accent)!important;outline-offset:3px;animation:pl 1s ease-in-out 4;border-radius:10px;position:relative;z-index:5}
@keyframes pl{50%{outline-color:transparent;box-shadow:0 0 0 9px rgba(201,100,66,.28)}}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:200}

const COMPARE=cols=>`<div class="vs">${cols.map((c,i)=>`<div class="vcol vi ${c.cls||''}" data-at="${0.3+i*0.9}"><div class="vcic">${IC[c.ic]}</div><b>${c.h}</b>${c.lines.map((l,j)=>`<span class="vi" data-at="${0.8+i*0.9+j*0.45}">${l}</span>`).join('')}</div>`).join('')}</div>`;
const FLOW=(items,note)=>`<div class="vs">${items.map((x,i)=>(i?`<div class="varr vi" data-at="${0.15+i*0.8}">→</div>`:'')+`<div class="vbox vi" data-at="${0.4+i*0.8}">${IC[x.ic]}<b>${x.l}</b><small>${x.s||''}</small></div>`).join('')}${note?`<div class="vnote vi" data-at="${0.8+items.length*0.8}">${note}</div>`:''}</div>`;
const TYPE=(label,text,btn)=>`<div class="vs vs-y"><div class="vcomp vi" data-at="0.2"><div class="vlab">${label}</div><div class="vtxt" data-type="${esc(text)}" data-prog="0.9,${(text.length/13).toFixed(1)}"></div><div class="vbtn vi" data-at="${(1.3+text.length/13).toFixed(1)}">${btn||'送出'}</div></div></div>`;
const LIST=(title,items)=>`<div class="vs vs-l"><div class="vlt vi" data-at="0.2">${title}</div>${items.map((x,i)=>`<div class="vli vi" data-at="${0.9+i*0.9}"><i>${IC.check}</i>${x}</div>`).join('')}</div>`;
const FILES=(from,to,note)=>`<div class="vs vs-d"><div class="vfiles">${from.map((f,i)=>`<div class="vf vi" data-at="${0.3+i*0.3}">${IC.file}${f}</div>`).join('')}</div><div class="vproc"><div class="vbar"><i data-prog="${(0.6+from.length*0.3).toFixed(1)},2.4"></i></div><small class="vi" data-at="1">Claude 處理中…</small></div><div class="vout vi" data-at="${(0.6+from.length*0.3+2.4).toFixed(1)}">${IC.sheet}<b>${to}</b><small>${note||''}</small></div></div>`;

function toast(msg,kind){
 const box=$('#toasts');if(!box)return;
 const d=document.createElement('div');d.className='toast '+(kind||'');d.textContent=msg;box.appendChild(d);
 setTimeout(()=>d.remove(),kind==='ok'?2600:3600);
 while(box.children.length>3)box.firstChild.remove();
}
function pulse(sel){
 $$('.pulse').forEach(e=>e.classList.remove('pulse'));
 const el=$(sel);if(!el)return false;
 el.classList.add('pulse');el.scrollIntoView({block:'nearest',behavior:'smooth'});
 setTimeout(()=>el.classList.remove('pulse'),4500);return true;
}

/* ========== 任務執行 ========== */
function pickScenario(p){
 for(const id of ['delete','dunning','bank','invoices'])if(SCEN[id].re.test(p))return SCEN[id];
 return SCEN.generic;
}
function sendPrompt(){
 const p=S.prompt.trim();
 if(!p){toast('請先輸入任務內容，或點下方的建議卡片');return}
 if(S.view==='task'&&S.active){ // 追問
  const k=S.tasks.find(x=>x.id===S.active);
  if(k&&k.status==='done'){k.msgs.push({r:'u',t:p});S.prompt='';renderSim();emit('followup');
   setTimeout(()=>{k.msgs.push({r:'c',t:'收到！我會依你的補充調整並更新輸出檔案。<br><small style="color:var(--muted)">（教學模擬：此處不會真的修改檔案）</small>'});renderSim()},800);return}
  if(k&&(k.status==='running')){toast('Claude 還在工作中，等這個任務完成再追問');return}
 }
 const sc=pickScenario(p);
 const k={id:++_uid,title:p.length>16?p.slice(0,16)+'…':p,prompt:p,folder:S.folder,sc,status:'plan',steps:[],msgs:[{r:'u',t:p}],out:[],_i:0,pending:null};
 S.tasks.unshift(k);S.active=k.id;S.view='task';S.prompt='';
 const f=S.folder?FOLDERS[S.folder]:null;
 let block=null;
 if(f&&f.sens)block={t:`⚠ 我看到授權的「${f.name}」含有薪資單與身分證，和這個任務無關。<b>建議改授權較小、較單純的資料夾</b>，再重新送出。`,ev:'send_sensitive'};
 else if(sc.id!=='dunning'&&sc.id!=='generic'&&!f)block={t:'我還沒有任何資料夾的存取權限。請先<b>選擇資料夾</b>，我才能讀取資料。',ev:'send_no_folder'};
 else if(sc.folder&&S.folder!==sc.folder)block={t:`這個任務需要「${FOLDERS[sc.folder].name}」的資料，但目前授權的是「${f.name}」，裡面沒有相關檔案。請改選資料夾後重新送出。`,ev:'send_mismatch'};
 if(block){k.status='blocked';S.prompt=p;k.msgs.push({r:'c',t:block.t,btn:[{act:'folder-open',l:'選擇資料夾'}]});renderSim();emit(block.ev);return}
 runTask(k);
}
function runTask(k){
 let sc=k.sc,variant=sc.id;
 let steps=sc.steps.map(s=>({...s}));
 if(sc.id==='dunning'){
  if(S.conn.gmail){variant='dunning_gmail';steps[2].t='在 Gmail 建立 3 封草稿（不會自動寄出）';k.out=[{name:'Gmail 草稿 ×3',type:'gmail',pv:'gmail'}]}
  else{steps[2].t='沒有連接 Gmail，改存成檔案：催款信草稿.md';k.out=[{name:'催款信草稿.md',type:'md',pv:'dunning'}]}
 }else k.out=sc.out.map(o=>({...o}));
 k.variant=variant;k.steps=steps.map(s=>({t:s.t,st:'todo',perm:s.perm}));k.status='running';k._i=0;
 k.msgs.push({r:'c',t:'好的，我先擬定計畫，再依序執行。你可以隨時在右側「<b>進度</b>」看到我做到哪一步。'});
 renderSim();emit('task_started:'+sc.id);
 advance(k);
}
function advance(k){
 if(!S.tasks.includes(k))return;
 if(k._i>=k.steps.length)return finish(k);
 const st=k.steps[k._i];st.st='run';renderSim();
 setTimeout(()=>{
  if(!S.tasks.includes(k))return;
  if(st.perm){k.pending={i:k._i};k.msgs.push({r:'perm',perm:st.perm,state:'ask'});renderSim();emit('perm_asked:'+st.perm.kind);return}
  st.st='done';k._i++;renderSim();advance(k);
 },1000);
}
function respondPerm(ok){
 const k=S.tasks.find(x=>x.id===S.active);if(!k||!k.pending)return;
 const m=[...k.msgs].reverse().find(x=>x.r==='perm'&&x.state==='ask');if(!m)return;
 const kind=m.perm.kind,st=k.steps[k.pending.i];
 m.state=ok?'allow':'deny';k.pending=null;k.denied=k.denied||{};k.denied[kind]=!ok;
 st.st=ok?'done':'skip';k._i++;
 if(!ok&&kind==='delete'){k.steps.slice(k._i).forEach(s=>s.st='skip');k._i=k.steps.length}
 renderSim();emit((ok?'perm_allowed:':'perm_denied:')+kind);
 if(ok&&kind==='delete')toast('⚠ 在真實環境中，刪除後可能無法復原。沒備份時請拒絕。','warn');
 setTimeout(()=>advance(k),400);
}
function finish(k){
 k.status='done';const v=k.variant,d=k.denied||{};
 const files=k.out.length?{r:'files',f:k.out}:null;
 const T2={
  invoices:`<b>完成了！</b>我整理了 12 張發票，產出：<ul><li>發票彙整_2026Q3.xlsx：日期、廠商、統編、金額</li><li>異常清單.md：2 張缺統編、1 張金額與品項不符</li></ul>${d.rename?'你拒絕了重新命名，所以原檔名維持不變。<br>':'已把檔名統一改為「日期_廠商_金額」。<br>'}建議你<b>先點開 Excel 抽查幾列</b>，再正式使用。`,
  bank:'<b>完成了！</b>共比對 3 個月的交易，找到 <b>3 筆未達帳</b>（匯款在途、手續費、未兌現支票）。請抽查並對照原始單據。',
  dunning:'<b>完成了。</b>目前沒有連接 Gmail，所以我把催款信存成檔案。若想直接在 Gmail 建草稿，請先到「自訂 → 連接器」連接 Gmail。',
  dunning_gmail:'<b>完成了！</b>我在 Gmail 建立了 <b>3 封草稿</b>，<b>都還沒寄出</b>。請逐封檢查金額與語氣，確認後再自行寄出。',
  delete:d.delete?'好的，<b>我沒有刪除任何檔案</b>。已把待刪除清單存成檔案，確認備份後你可以再決定。':'已刪除 47 個檔案。<br><small style="color:var(--warn)">（真實環境中這類操作可能無法復原，下次請先備份。）</small>',
  generic:'<b>完成了！</b>我已讀取資料夾並整理出摘要（教學模擬）。'
 };
 if(v==='delete'&&!d.delete)k.out=[];
 k.msgs.push({r:'c',t:T2[v]||T2.generic,btn:v==='dunning'?[{act:'goto-conn',l:'前往連接器'}]:null});
 if(k.out.length)k.msgs.push({r:'files',f:k.out});
 renderSim();emit('task_done:'+v);
}

/* ========== 動畫影片播放器（時間驅動，與 Remotion 同樣的「畫面 = f(時間)」概念） ========== */
class Player{
 constructor(host,scenes,key){
  Object.assign(this,{h:host,sc:scenes,key,t:0,playing:false,idx:-1,speed:1,cap:true,tts:false,done:false,started:false,raf:0,last:0});
  this.total=scenes.reduce((a,s)=>a+s.dur,0);this.starts=[];let c=0;scenes.forEach(s=>{this.starts.push(c);c+=s.dur});
  host.innerHTML=`<div class="vwrap"><div class="vstage"><div class="vscene"></div><div class="vcap"></div><button class="vplay" data-v="play" aria-label="播放動畫">▶ <span>播放動畫</span></button></div>
  <div class="vctl"><button class="pp" data-v="toggle" aria-label="播放或暫停">▶</button><input class="vseek" type="range" min="0" max="1000" value="0" aria-label="影片進度"><span class="vtime">0:00 / ${fmt(this.total)}</span><button data-v="speed" aria-label="播放速度">1x</button><button data-v="cap" class="on">字幕</button><button data-v="tts" title="用瀏覽器朗讀字幕">旁白</button><button data-v="full">全螢幕</button></div></div>`;
  this.wrap=$('.vwrap',host);this.stage=$('.vstage',host);this.scene=$('.vscene',host);this.capEl=$('.vcap',host);
  this.seek=$('.vseek',host);this.timeEl=$('.vtime',host);this.pp=$('.pp',host);this.playBtn=$('.vplay',host);
  host.addEventListener('click',e=>{const b=e.target.closest('[data-v]');if(!b)return;const a=b.dataset.v;
   if(a==='play'||a==='toggle'){this.playing?this.pause():this.play()}
   else if(a==='speed'){this.speed=this.speed===1?1.5:this.speed===1.5?2:1;b.textContent=this.speed+'x'}
   else if(a==='cap'){this.cap=!this.cap;b.classList.toggle('on',this.cap);this.capEl.classList.toggle('off',!this.cap)}
   else if(a==='tts'){this.tts=!this.tts;b.classList.toggle('on',this.tts);if(!this.tts)this.say('');else this.say(this.sc[Math.max(0,this.idx)].cap)}
   else if(a==='full'){try{(document.fullscreenElement?document.exitFullscreen():this.wrap.requestFullscreen()).catch(()=>{})}catch(err){}}});
  this.seek.addEventListener('input',()=>{this.started=true;this.playBtn.classList.add('hide');this.t=this.seek.value/1000*this.total;this.draw(this.t);this.checkDone()});
  this.ro=new ResizeObserver(()=>{this.stage.style.fontSize=Math.max(6,this.stage.clientWidth/58)+'px'});this.ro.observe(this.stage);
  this.stage.style.fontSize=Math.max(6,this.stage.clientWidth/58)+'px';
  this.draw(1.6);this.timeEl.textContent='0:00 / '+fmt(this.total);
 }
 say(txt){try{if(!('speechSynthesis' in window))return;speechSynthesis.cancel();if(!txt||!this.tts)return;const u=new SpeechSynthesisUtterance(txt);u.lang='zh-TW';u.rate=1.05;speechSynthesis.speak(u)}catch(e){}}
 play(){
  if(this.t>=this.total-0.05)this.t=0;
  if(!this.started){this.started=true;this.t=0;this.idx=-1}
  this.playing=true;this.playBtn.classList.add('hide');this.pp.textContent='❚❚';this.last=performance.now();
  this.say(this.sc[Math.max(0,this.idx)>=0?Math.max(0,this.idx):0].cap);
  cancelAnimationFrame(this.raf);this.raf=requestAnimationFrame(ts=>this.tick(ts));
 }
 pause(){this.playing=false;this.pp.textContent='▶';cancelAnimationFrame(this.raf);this.say('')}
 tick(ts){
  if(!this.playing)return;
  const dt=Math.min(0.1,(ts-this.last)/1000);this.last=ts;this.t=Math.min(this.total,this.t+dt*this.speed);
  this.draw(this.t);
  if(this.t>=this.total){this.pause();this.playBtn.querySelector('span').textContent='再看一次';this.playBtn.classList.remove('hide');this.checkDone();return}
  this.raf=requestAnimationFrame(x=>this.tick(x));
 }
 checkDone(){if(!this.done&&this.t>=this.total-0.4){this.done=true;emit('video_done:'+this.key)}}
 draw(t){
  let i=0;for(let k=0;k<this.sc.length;k++)if(t>=this.starts[k])i=k;
  const local=t-this.starts[i];
  if(i!==this.idx){this.scene.innerHTML=this.sc[i].html;this.capEl.textContent=this.sc[i].cap;
   if(this.playing&&this.idx!==-1)this.say(this.sc[i].cap);this.idx=i}
  $$('[data-at]',this.scene).forEach(e=>e.classList.toggle('in',local>=+e.dataset.at));
  $$('[data-prog]',this.scene).forEach(e=>{const [a,d]=e.dataset.prog.split(',').map(Number);const p=clamp((local-a)/d);e.style.setProperty('--p',p);
   if(e.dataset.type!==undefined){const f=e.dataset.type;e.textContent=f.slice(0,Math.ceil(f.length*p))+(p>0&&p<1?'▍':'')}});
  this.seek.value=Math.round(t/this.total*1000);this.timeEl.textContent=fmt(t)+' / '+fmt(this.total);
 }
 destroy(){this.pause();try{this.ro.disconnect()}catch(e){}}
}

/* ========== 課程控制 ========== */
const STORE_KEY='cowork-course-v1';
const POINTS={step:10,quiz1:5,quiz2:2};
const hintOpen={};const wrong={};
const Course={
 cur:0,player:null,
 P:Object.assign({steps:{},quiz:{},name:'',cel:{}},store.get(STORE_KEY,{})),
 teacher:store.get('cowork-teacher',false),
 save(){store.set(STORE_KEY,this.P)},
 stepsDone(u){return u.steps.every(s=>this.P.steps[s.id])},
 quizDone(u,i){return u.quiz.every((_,q)=>this.P.quiz[u.id+'-'+q])},
 unitDone(i){const u=UNITS[i];return this.stepsDone(u)&&this.quizDone(u,i)},
 unlocked(i){return this.teacher||i===0||this.unitDone(i-1)},
 score(){let s=0;UNITS.forEach(u=>{u.steps.forEach(x=>{if(this.P.steps[x.id])s+=POINTS.step});u.quiz.forEach((_,q)=>{s+=this.P.quiz[u.id+'-'+q]||0})});return s},
 max(){return UNITS.reduce((a,u)=>a+u.steps.length*POINTS.step+u.quiz.length*POINTS.quiz1,0)},
 evaluate(){
  const u=UNITS[this.cur];let ch=false;
  u.steps.forEach(s=>{if(!this.P.steps[s.id]&&s.check()){this.P.steps[s.id]=1;ch=true;toast('+10 分  ✓ '+s.text,'ok')}});
  if(ch){this.save();this.renderSteps();this.renderTop();this.afterProgress()}
 },
 afterProgress(){
  const i=this.cur;this.renderNav();this.renderFoot();
  if(this.unitDone(i)&&!this.P.cel[i]){this.P.cel[i]=1;this.save();confetti();toast(i===UNITS.length-1?'全部單元完成！往下領取結業證書':'單元完成！下一單元已解鎖','ok')}
 },
 go(i){
  if(!this.unlocked(i)){toast('請先完成上一個單元的練習與小測驗','warn');return}
  if(this.player)this.player.destroy();
  this.cur=i;this.renderUnit();this.evaluate();$('.coach').scrollTop=0;
 },
 renderTop(){
  const sc=this.score(),mx=this.max();
  $('#pbar').style.width=Math.round(sc/mx*100)+'%';
  $('#score').innerHTML=`積分 <b>${sc}</b> / ${mx}`;
  const t=$('#teacher');t.classList.toggle('on',this.teacher);t.setAttribute('aria-pressed',this.teacher);
 },
 renderNav(){
  $('#units').innerHTML=UNITS.map((u,i)=>`<button class="upill ${i===this.cur?'on':''} ${this.unitDone(i)?'done':''} ${this.unlocked(i)?'':'lock'}" data-act="unit" data-i="${i}"><span class="n">${this.unitDone(i)?'✓':this.unlocked(i)?i+1:'🔒'}</span>${u.short}</button>`).join('');
 },
 renderUnit(){
  const u=UNITS[this.cur],n=this.cur+1;
  $('#unit').innerHTML=`<div class="kick">單元 ${n} / ${UNITS.length}</div><h2 class="serif">${u.title}</h2><p class="goal">${u.goal}</p>
  <div id="player"></div>
  <h3>重點卡 <em>點一下翻面看會計比喻</em></h3><div class="cards">${u.cards.map(c=>`<div class="kcard" data-act="flip" role="button" tabindex="0" aria-label="${c.f}，點一下翻面"><div><span class="f"><b>${c.f}</b><small>${c.s}</small></span><span class="b">${c.b}</span></div></div>`).join('')}</div>
  <h3>實作練習 <em>在右邊模擬器操作，會自動打勾</em></h3><ul class="steps" id="steps"></ul>
  ${u.builder?builderHtml():''}
  <h3>小測驗</h3><div class="quiz" id="quiz"></div>
  <div id="foot"></div>`;
  this.player=new Player($('#player'),VIDEOS[u.id],u.id);
  this.renderSteps();this.renderQuiz();this.renderFoot();this.renderNav();this.renderTop();
  if(u.builder)buildPrompt();
 },
 renderSteps(){
  const u=UNITS[this.cur];
  $('#steps').innerHTML=u.steps.map((s,i)=>{const ok=this.P.steps[s.id];
   return `<li class="step ${ok?'ok':''}"><div class="row"><span class="chk">${ok?IC.check:''}</span><span class="tx">${i+1}. ${s.text}</span><span class="acts">${ok?'':`<button class="mini" data-act="hint" data-id="${s.id}">提示</button>`}${this.teacher&&!ok?`<button class="mini" data-act="force" data-id="${s.id}">略過</button>`:''}</span></div>${hintOpen[s.id]&&!ok?`<div class="hint">💡 ${s.hint}（模擬器中對應的位置已閃爍標示）</div>`:''}</li>`}).join('');
 },
 renderQuiz(){
  const u=UNITS[this.cur];
  $('#quiz').innerHTML=u.quiz.map((q,qi)=>{const key=u.id+'-'+qi,got=this.P.quiz[key],bad=wrong[key]||[];
   return `<div class="q ${got?'ok':''}"><p>Q${qi+1}. ${q.q}</p><div class="opts">${q.o.map((o,oi)=>`<button class="opt ${got&&oi===q.a?'good':''} ${bad.includes(oi)?'bad':''} ${this.teacher&&!got&&oi===q.a?'tip':''}" data-act="ans" data-q="${qi}" data-o="${oi}" ${got?'disabled':''}>${String.fromCharCode(65+oi)}. ${o}</button>`).join('')}</div>${got?`<div class="why">✓ ${q.why}</div>`:bad.length?'<div class="why" style="color:var(--warn);background:var(--warn-soft)">再想想，換一個選項試試。</div>':''}</div>`}).join('');
 },
 renderFoot(){
  const i=this.cur,u=UNITS[i],done=this.unitDone(i),last=i===UNITS.length-1;
  let h=`<div class="nextbar"><button class="btn ghost" data-act="unit" data-i="${i-1}" ${i===0?'disabled':''}>← 上一單元</button>`;
  h+=last?`<span></span>`:`<button class="btn" data-act="unit" data-i="${i+1}" ${done||this.teacher?'':'disabled'}>${done||this.teacher?'下一單元 →':'完成練習與測驗後解鎖'}</button>`;
  h+='</div>';
  if(last&&UNITS.every((_,k)=>this.unitDone(k))){
   const sc=this.score(),mx=this.max(),pct=sc/mx,rank=pct>=.9?'Cowork 達人':pct>=.7?'合格的 AI 同事':'見習生';
   h+=`<div class="cert"><h3>結業！你的成績</h3><div class="big">${sc} / ${mx}</div><p>稱號：<b>${rank}</b></p><input class="fld" id="cert-name" placeholder="輸入姓名" value="${esc(this.P.name||'')}" aria-label="姓名"><br><button class="btn" data-act="cert">下載結業證書 PNG</button></div>`;
  }
  $('#foot').innerHTML=h;
 }
};

 <label>3) 預覽（資料來源＝你授權的資料夾；格式＝Excel）<textarea id="pb-out" rows="4" readonly></textarea></label><button class="btn" id="pb-send" data-act="pb-send">送到 Cowork 輸入框 →</button></div>`;
}
function buildPrompt(){
 const g=$('#pb-goal');if(!g)return '';
 const ls=$$('.pb-l:checked').map(x=>x.value);
 const t=`請讀取我授權的資料夾，${g.value}。輸出：Excel 檔（一列一筆，含欄位標題）。${ls.length?'限制：'+ls.join('；')+'。':''}`;
 $('#pb-out').value=t;return t;
}

/* ========== 全域事件 ========== */
const GA={
 unit(el){const i=+el.dataset.i;if(i>=0&&i<UNITS.length)Course.go(i)},
 flip(el){el.classList.toggle('flip')},
 hint(el){
  const u=UNITS[Course.cur],s=u.steps.find(x=>x.id===el.dataset.id);hintOpen[s.id]=true;Course.renderSteps();
  if(matchMedia('(max-width:1000px)').matches&&!s.sel.startsWith('.vplay')){setPane('sim');setTimeout(()=>pulse(s.sel),50)}else pulse(s.sel);
 },
 force(el){const s=UNITS[Course.cur].steps.find(x=>x.id===el.dataset.id);Course.P.steps[s.id]=1;Course.save();Course.renderSteps();Course.renderTop();Course.afterProgress()},
 ans(el){
  const u=UNITS[Course.cur],qi=+el.dataset.q,oi=+el.dataset.o,q=u.quiz[qi],key=u.id+'-'+qi;
  if(Course.P.quiz[key])return;
  if(oi===q.a){Course.P.quiz[key]=(wrong[key]&&wrong[key].length)?POINTS.quiz2:POINTS.quiz1;Course.save();Course.renderQuiz();Course.renderTop();Course.afterProgress()}
  else{(wrong[key]=wrong[key]||[]).push(oi);Course.renderQuiz()}
 },
 'pb-send'(){
  const t=buildPrompt();S.prompt=t;S.mode='cowork';S.view='home';S.modal=null;renderSim();emit('prompt_built');
  toast('已送到輸入框！接著確認資料夾，再按送出','ok');if(matchMedia('(max-width:1000px)').matches)setPane('sim');
 },
 cert(){drawCert()},
 pane(el){setPane(el.dataset.p)},
 teacher(){Course.teacher=!Course.teacher;store.set('cowork-teacher',Course.teacher);Course.renderUnit();toast(Course.teacher?'老師模式：全部單元解鎖、顯示答案提示、可略過步驟':'已關閉老師模式')},
 reset(){if(confirm('確定要清除所有學習進度與積分嗎？')){store.del(STORE_KEY);location.reload()}}
};
function setPane(p){document.body.dataset.pane=p;$$('.panes button').forEach(b=>b.classList.toggle('on',b.dataset.p===p))}
document.addEventListener('click',e=>{
 const el=e.target.closest('[data-act]');if(!el)return;
 const a=el.dataset.act;
 if(a==='modal-bg'){ACT[a](el,e);return}
 const f=GA[a]||ACT[a];if(f){f(el,e)}
});
document.addEventListener('keydown',e=>{
 if(e.target.id==='composer'&&e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();sendPrompt();return}
 if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('kcard')){e.preventDefault();e.target.classList.toggle('flip')}
 if(e.key==='Escape'&&S.modal){S.modal=null;renderSim()}
});
document.addEventListener('input',e=>{
 if(e.target.id==='composer')S.prompt=e.target.value;
 if(e.target.id==='cert-name'){Course.P.name=e.target.value;Course.save()}
 if(e.target.id==='pb-goal'||e.target.classList.contains('pb-l'))buildPrompt();
});
document.addEventListener('change',e=>{if(e.target.id==='pb-goal'||e.target.classList.contains('pb-l'))buildPrompt()});

/* ========== 結業證書 / 彩帶 ========== */
function drawCert(){
 const c=document.createElement('canvas');c.width=1600;c.height=1131;const g=c.getContext('2d');
 g.fillStyle='#FBF8F2';g.fillRect(0,0,1600,1131);
 g.strokeStyle='#C96442';g.lineWidth=10;g.strokeRect(50,50,1500,1031);g.lineWidth=2;g.strokeRect(75,75,1450,981);
 g.textAlign='center';g.fillStyle='#2B2A27';
 const serif='"Noto Serif TC","Songti TC","PMingLiU",serif';
 g.font=`700 84px ${serif}`;g.fillText('結業證書',800,260);
 g.font=`36px ${serif}`;g.fillStyle='#6F6A5F';g.fillText('Claude Cowork 基礎入門班',800,330);
 const name=(Course.P.name||'').trim()||'學員';
 g.fillStyle='#A94E31';g.font=`700 110px ${serif}`;g.fillText(name,800,560);
 g.fillStyle='#2B2A27';g.font=`38px ${serif}`;g.fillText('完成全部 6 個單元的互動練習與小測驗',800,660);
 const sc=Course.score(),mx=Course.max(),pct=sc/mx;
 g.fillText(`積分 ${sc} / ${mx}　稱號：${pct>=.9?'Cowork 達人':pct>=.7?'合格的 AI 同事':'見習生'}`,800,730);
 g.fillStyle='#6F6A5F';g.font=`30px ${serif}`;g.fillText(new Date().toLocaleDateString('zh-TW'),800,900);
 const a=document.createElement('a');a.download='Cowork結業證書_'+name+'.png';a.href=c.toDataURL('image/png');document.body.appendChild(a);a.click();a.remove();
}
function confetti(){
 if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
 const cv=document.createElement('canvas');cv.id='confetti';cv.width=innerWidth;cv.height=innerHeight;document.body.appendChild(cv);
 const g=cv.getContext('2d'),cols=['#C96442','#3E7C59','#3B6EA5','#D9A441','#2B2A27'];
 const ps=Array.from({length:90},()=>({x:innerWidth/2,y:innerHeight*.35,vx:(Math.random()-.5)*14,vy:-Math.random()*13-3,r:Math.random()*6+3,c:cols[Math.random()*5|0],a:Math.random()*6}));
 let f=0;(function loop(){g.clearRect(0,0,cv.width,cv.height);ps.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.a+=.2;g.save();g.translate(p.x,p.y);g.rotate(p.a);g.fillStyle=p.c;g.fillRect(-p.r,-p.r/2,p.r*2,p.r);g.restore()});
  if(++f<110)requestAnimationFrame(loop);else cv.remove()})();
}

/* ========== 啟動 ========== */
window.addEventListener('DOMContentLoaded',()=>{
 const q=new URLSearchParams(location.search);
 if(q.get('teacher')==='1'){Course.teacher=true;store.set('cowork-teacher',true)}
 renderSim();
 let start=0;for(let i=0;i<UNITS.length;i++){if(Course.unlocked(i)&&!Course.unitDone(i)){start=i;break}start=i}
 Course.cur=start;Course.renderUnit();setPane('coach');
 window.addEventListener('beforeunload',()=>{try{speechSynthesis.cancel()}catch(e){}});
});
