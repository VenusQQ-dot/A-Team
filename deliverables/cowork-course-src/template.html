<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Claude Cowork 基礎入門班</title>
<style>
/*CSS*/
</style>
</head>
<body data-pane="coach" data-view="map" data-skin="candy">
<div id="app">
 <header class="topbar">
  <div class="brand"><div class="logo" aria-hidden="true">✺</div><div><b>Claude Cowork 基礎入門班</b><small>會計新手互動教學・教學仿製介面</small></div></div>
  <div class="vsw" role="group" aria-label="檢視模式"><button data-act="view" data-v="map">心智圖</button><button data-act="view" data-v="layers">分層卡片</button><button data-act="view" data-v="overview">全景</button><button data-act="view" data-v="learn">實作課程</button></div>
  <div class="pbar" role="progressbar" aria-label="學習進度"><i id="pbar"></i></div>
  <div class="score" id="score"></div>
  <div class="tspacer"></div>
  <div class="skins" role="group" aria-label="換膚"><button data-act="skin" data-s="candy" title="糖果粗框" style="--c:#F7C948"></button><button data-act="skin" data-s="paper" title="米色手札" style="--c:#E8E0D0"></button><button data-act="skin" data-s="arcade" title="像素夜" style="--c:#0F1A45"></button><button data-act="skin" data-s="navy" title="簡報藍" style="--c:#183868"></button></div>
  <div class="panes"><button class="tbtn on" data-act="pane" data-p="coach">課程</button><button class="tbtn" data-act="pane" data-p="sim">模擬器</button></div>
  <button class="tbtn" id="teacher" data-act="teacher" aria-pressed="false" title="解鎖全部單元、顯示答案提示">老師模式</button>
  <button class="tbtn" data-act="reset">重置進度</button>
 </header>
 <section id="view-map" class="view" aria-label="心智圖">
  <div class="mmbar"><div class="mtabs" id="mmtabs" role="tablist"></div><div class="mmtools"><button data-act="mm-all">全展開</button><button data-act="mm-none">全收合</button><button data-act="mm-fit">看全面</button><button data-act="mm-zoom" data-f="1.2" aria-label="放大">＋</button><button data-act="mm-zoom" data-f="0.83" aria-label="縮小">－</button></div></div>
  <p class="mmlegend">點節點展開／收合；拖曳移動，兩指或 ＋－ 縮放。<b class="r">紅字＝這一站最常出事的地方。</b>框框＝白話講它在幹嘛。<b class="g">▶ 去練習</b>＝跳到模擬器動手做。</p>
  <div id="mmv" tabindex="0" aria-label="心智圖畫布"><div id="mmc"><svg id="mmsvg" aria-hidden="true"></svg></div></div>
 </section>
 <section id="view-layers" class="view" aria-label="分層卡片"></section>
 <section id="view-overview" class="view" aria-label="全景"></section>
 <div class="layout">
  <section class="coach" aria-label="課程內容">
   <div class="rd-top"><button class="icon-btn" data-act="menu" aria-label="開啟目錄">▤</button><div class="rd-title"><b>Cowork 基礎入門班</b><small id="rd-sub"></small></div><button class="icon-btn" data-act="gloss" aria-label="名詞小辭典" title="名詞小辭典">？</button><span class="rd-count" id="rd-count"></span></div>
   <div class="rd-body" id="unit"></div>
   <div class="rd-foot"><button class="circ" data-act="prev" aria-label="上一課">‹</button><div class="segs" id="segs" role="tablist" aria-label="課程進度"></div><button class="circ go" data-act="next" aria-label="下一課">›</button></div>
  </section>
  <section class="stage" aria-label="Cowork 模擬器">
   <div class="deco" aria-hidden="true">
    <svg class="d1" viewBox="0 0 50 50"><path d="M25 3 47 45H3z"/></svg>
    <svg class="d2" viewBox="0 0 50 50"><path d="M3 47V3a44 44 0 0 1 44 44z"/></svg>
    <svg class="d3" viewBox="0 0 50 50"><path d="M25 2 31 19 48 25 31 31 25 48 19 31 2 25 19 19z"/></svg>
    <svg class="d4" viewBox="0 0 50 50"><path d="M20 4h10v16h16v10H30v16H20V30H4V20h16z"/></svg>
   </div>
   <div class="sticker" aria-hidden="true">TAP ANYTHING<b>每個都能按，真的</b></div>
   <div class="sim" id="sim"></div>
  </section>
 </div>
</div>
<div id="sheet" class="sheet-bg" hidden data-act="sheet-bg"></div>
<div id="toasts" aria-live="polite"></div>
<script>
/*JS*/
</script>
</body>
</html>
